[pytest]
# `pytest` with no arguments used to walk the whole backend tree, including
# `scratch/` — where the repo convention (CLAUDE.md) says throwaway probes go.
# Several of those are scripts named test_*.py that call sys.exit() at import,
# so a bare `pytest` died in collection with an INTERNALERROR and ran NOTHING.
# The suite was fine; you just had to already know to type `pytest tests`.
# `../apps/*/tests` is an INSTALLED APP's own tests. An app's tests belong to the
# app -- they left this repo with its source (stage 7) -- but they must still
# run, or extraction silently converts a tested app into an untested one, which
# is a worse outcome than leaving the tests here.
#
# A glob is the point: this line names no app. On a fresh clone `apps/` does not
# exist, the pattern matches nothing, and the suite is the platform's alone.
testpaths = tests ../apps/*/tests
norecursedirs = scratch tmp .venv .git node_modules
markers =
    reads_the_operators_tenant(reason): this test deliberately reads the real
        organization, and says why. It lifts conftest's
        `_no_test_may_resolve_the_real_tenant` for that test only. Reads only:
        there is no marker that permits a WRITE, because a test that writes the
        operator's data has no reason that survives being written down.
