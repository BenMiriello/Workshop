t ${timeScope==='hours'?'sel':''}&quot; onclick=&quot;pickTime('hours')&quot;&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;${svg('clock',18,1.9)}&lt;/span&gt;&lt;b&gt;Times of day&lt;/b&gt;&lt;span class=&quot;pm&quot;&gt;hourly average&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;sheetfoot&quot;&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;closeSheet()&quot;&gt;Done&lt;/button&gt;&lt;/div&gt;`;showSheet()}\n\n/* ===================================================================== interactions */\nfunction pickLoc(id){cur=id==='all'?'yard':id;curDev=PLACES[cur].defDevice;recentPage=0;if(tab==='locations'||tab==='devices')tab='home';closeSheet();render()}\nfunction pickDev(id){curDev=id;if(tab==='devices')tab='home';closeSheet();render()}\nfunction pickTime(k){timeScope=k;closeSheet();render()}\nfunction toggleLayer(k){if(k==='div')showDiv=!showDiv;else showWx=!showWx;render()}\nfunction setFilter(k){sprFilter=k;render()}\nfunction setDet(k){detFilter=k;openDet=-1;render()}\nfunction toggleDet(i){openDet=openDet===i?-1:i;render()}\nfunction setDetStatus(i,s){DET[i].st=s;render()}\nfunction setFcDay(i){fcDay=i;render()}\nfunction fcToggle(k){if(k==='sp')fcSpecies=!fcSpecies;else if(k==='wxw')fcWxWeek=!fcWxWeek;else if(k==='div')fcDiv=!fcDiv;else if(k==='wxd')fcWxDay=!fcWxDay;render()}\nfunction setAtlas(s){atlasScope=s;atlasCluster=null;render()}\nfunction setCluster(i){atlasCluster=atlasCluster===i?null:i;render()}\nfunction toggleEdit(id){editId=editId===id?null:id;render()}\nfunction toggleHome(id){Object.values(PLACES).forEach(p=&gt;p.home=false);PLACES[id].home=true;render()}\nfunction toggleSet(k){if(k==='save')setSave=!setSave;else if(k==='atlas')setAtlasSave=!setAtlasSave;else if(k==='nb')setNonBird=!setNonBird;render()}\nfunction setRangeVal(k,v){if(k==='conf')setMinConf=v/100;else setNew=+v;render()}\nfunction setRangeKey(k){setRange=k;render()}\nfunction setWin(w){nowWindow=w;recentPage=0;const seg=document.getElementById('nowseg');if(seg)[...seg.children].forEach(b=&gt;b.classList.toggle('on',b.textContent===w));const rc=document.getElementById('recentcard');if(rc)rc.innerHTML=recentList()}\nfunction pageRecent(d){recentPage+=d;const rc=document.getElementById('recentcard');if(rc)rc.innerHTML=recentList()}\nfunction toggleListen(){listening=!listening;render()}\nfunction confirmSp(btn){const row=btn.closest('.sprow');row.style.transition='opacity .25s,transform .25s';row.style.opacity='0';row.style.transform='translateX(8px)';setTimeout(()=&gt;{const p=PLACES[cur];p.confirmed++;p.suggested=Math.max(0,p.suggested-1);render()},260)}\n\n/* ===================================================================== live spectro + bird lane */\nlet spectroTimer=null,laneTimer=null;\nfunction startSpectro(){stopSpectro();const el=document.getElementById('spectro');if(!el)return;const bars=[...el.children];let t=0;\n  spectroTimer=setInterval(()=&gt;{t++;bars.forEach((b,i)=&gt;{const base=Math.sin(i*0.5+t*0.3)*0.5+0.5;const burst=((i&gt;16&amp;&amp;i&lt;24)||(i&gt;34&amp;&amp;i&lt;40))?Math.random()*0.7:Math.random()*0.25;b.style.height=Math.max(3,(base*0.35+burst)*100)+'%'})},140);\n  // bird-tag lane: spawn drifting tags (concept stand-in for the real sliding icons)\n  const lane=document.getElementById('birdlane');if(!lane)return;\n  const spawn=()=&gt;{const sp=NOW_HEARING[Math.floor(Math.random()*NOW_HEARING.length)];const tag=document.createElement('div');tag.className='btag';tag.innerHTML=`&lt;span class=&quot;bt-thumb&quot; style=&quot;color:${catFor(sp[0])}&quot;&gt;${svg('bird',10,2)}&lt;/span&gt;${sp[0]}`;tag.style.right='-30%';lane.appendChild(tag);let pos=-30;const mv=setInterval(()=&gt;{pos+=2.4;tag.style.right=pos+'%';if(pos&gt;120){clearInterval(mv);tag.remove()}},120)};\n  spawn();laneTimer=setInterval(spawn,2600);}\nfunction stopSpectro(){if(spectroTimer){clearInterval(spectroTimer);spectroTimer=null}if(laneTimer){clearInterval(laneTimer);laneTimer=null}}\n\nrender();\n\n&lt;/script&gt;\n&lt;/body&gt;\n&lt;/html&gt;\n\"><\u002Fiframe>\n   <\u002Fdiv>\n   <p class=\"cap-note\" style=\"margin-top:14px\">Embedded full-resolution and fully interactive. The charts inside it are the prototype's own; the refined, decided versions are in Part 2 below.<\u002Fp>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">1.3 — Global scope<\u002Fdiv>\n   <h3 class=\"sh\">Location · Device · Time, everywhere<\u002Fh3>\n   <div class=\"prose\">\n     <p>A single persistent scope replaces all per-page and per-bird pickers. It applies on <b>every<\u002Fb> content page — including bird detail. Pickers render as a bottom sheet on mobile, a centered modal on web.<\u002Fp>\n     <ul>\n       <li><b>Default scope<\u002Fb> opens to the home location + its always-on device (<code>Yard · Yard Mic<\u002Fcode>) so the live feed and \"who's here now\" are present immediately — never an ambiguous \"all devices\".<\u002Fli>\n       <li><b>Time<\u002Fb> windows the analytical pages (Recent uses 15m / 1h / Today; Activity and Forecast use the longer ranges).<\u002Fli>\n       <li>Changing any scope dimension repoints every surface at once, including the Aviary and the live histogram.<\u002Fli>\n     <\u002Ful>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">1.4 — The pages<\u002Fdiv>\n   <h3 class=\"sh\">What each surface is for<\u002Fh3>\n   <p class=\"sec-sub\">Every page answers one question. Decisions below are final.<\u002Fp>\n   <div class=\"pages\">\n     <div class=\"pg\"><div class=\"loc\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><\u002Fsvg>Home<\u002Fdiv><div class=\"pgd\">The settled truth for the current scope: <b>Live card → Recent → Activity → Forecast peek → Top birds → at-a-glance stats.<\u002Fb> Confirmed-only; no status filter on Home, so nothing silently reshapes above the fold.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\">Recent<\u002Fdiv><div class=\"pgd\"><b>Presence, not chirp-count.<\u002Fb> Each species appears <b>once<\u002Fb>, newest first, with its latest time + <b>how many 15-min windows<\u002Fb> it appeared in. Windowed 15m / 1h / Today, paginated 10/page. Raw per-detection lists live on the bird page.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"><\u002Fline><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"><\u002Fline><\u002Fsvg>Birds<\u002Fdiv><div class=\"pgd\">The review surface. <b>Confirmed / Suggested / Rejected<\u002Fb> segmented at top, default Confirmed, counts match the list. The only place place-level status review happens.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\">Bird detail<\u002Fdiv><div class=\"pgd\">Uses the global scope (no local pickers). Confirmed activity chart; detection rows collapse to essentials, expand to per-event status + device; per-bird recording mode <b>(Default / Always / Never)<\u002Fb>.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>Forecast<\u002Fdiv><div class=\"pgd\">Species-led: the week chart + per-day detail + weather/light context. (Charts in Part 2.)<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4.5\" r=\"2.5\"><\u002Fcircle><circle cx=\"5\" cy=\"14\" r=\"2.5\"><\u002Fcircle><circle cx=\"19\" cy=\"14\" r=\"2.5\"><\u002Fcircle><path d=\"M12 7v3M10.5 12 6.8 13.2M13.5 12l3.7 1.2\"><\u002Fpath><\u002Fsvg>Atlas<\u002Fdiv><div class=\"pgd\">Embedding map for <b>labeling<\u002Fb> call clusters: <b>Overview<\u002Fb> (yard colored by species) ↔ <b>By-species<\u002Fb> (one bird's calls split into groups you listen to and name; <b>new calls auto-join the nearest group<\u002Fb>), plus zoom controls — <b>and<\u002Fb> the new soundscape insight views. (Charts in Part 2.)<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\">Recordings<\u002Fdiv><div class=\"pgd\">Storage meter + budget + per-clip pin/delete.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\">Settings<\u002Fdiv><div class=\"pgd\">Account; <b>detection accuracy<\u002Fb> — min confidence, location-filter strictness, new-species confirmation count, re-apply to past; recording &amp; Atlas budgets; non-bird display filter.<\u002Fdiv><\u002Fdiv>\n     <div class=\"pg\"><div class=\"loc\">Locations &amp; Devices<\u002Fdiv><div class=\"pgd\">Minimal inline-edit lists (rename / address / set home / mode / share / remove). <b>No per-location or per-device dashboards<\u002Fb> — viewing one = selecting it in the global scope. <b>Yard Mic is flagged always-on<\u002Fb> (home device + default scope).<\u002Fdiv><\u002Fdiv>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">1.5 — Watch out<\u002Fdiv>\n   <h3 class=\"sh\">Placeholders in the prototype — don't regress the real app to match<\u002Fh3>\n   <div class=\"prose\">\n     <div class=\"warn\"><p><b>Live histogram (Home live card):<\u002Fb> the structure prototype's generic spectrogram is a crude stand-in and <b>worse than what exists.<\u002Fb> Keep the <b>real production histogram<\u002Fb> (slides left over time, per-species icon riding each detection). Adopt only the container changes: a <b>Listen control + a single pulsing \"Live\" indicator inside the live-card header<\u002Fb>, and <b>remove the duplicate top-bar recording pill + top-bar Listen button<\u002Fb> — one recording affordance, not two.<\u002Fp><\u002Fdiv>\n     <ul>\n       <li><b>Atlas map:<\u002Fb> the prototype's scatter of dots is fake — keep the real UMAP embedding; adopt the organization only.<\u002Fli>\n       <li><b>Forecast copy/numbers &amp; bird photos:<\u002Fb> placeholders; wire to real model output / media.<\u002Fli>\n       <li><b>Diversity = Shannon H in production.<\u002Fb> The live charts in Part 2 use species-count-per-hour as a readable stand-in; the production activity/forecast charts should compute diversity as <b>Shannon H<\u002Fb>. Also keep the real chart engine's <b>All-days ↔ specific-day calendar scope<\u002Fb>, <b>bar drill-down<\u002Fb> (tap a day → that day's hours), and <code>maxBarSize<\u002Fcode> so 1–2-bar charts don't balloon. The single-bird activity chart omits diversity (a multi-species measure, meaningless for one bird).<\u002Fli>\n     <\u002Ful>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <!-- ===================== PART 2: CHARTS ===================== -->\n <div class=\"part\" id=\"p2\">\n   <div class=\"pe\">Part 2<\u002Fdiv>\n   <h2>Charts &amp; data-viz — live<\u002Fh2>\n   <p class=\"pd\">Every decided chart, <b>rendered and interactive right here<\u002Fb> — toggle the overlays, flip presence vs. detections. Below each is the encoding spec. <b>Global rules:<\u002Fb> Lucide icons only · smoothed trend lines with <b>no point dots<\u002Fb> · every series on a <b>labeled, color-matched axis<\u002Fb> · plain labels (\"Temperature\" not \"Weather\", \"species\" not \"spp\") · the day/night <b>sky backdrop kept but always paired with labeled Sunrise/Sunset markers<\u002Fb> · descriptive copy, never prescriptive · forecasts drawn as a <b>range<\u002Fb>.<\u002Fp>\n <\u002Fdiv>\n\n <section>\n   <div class=\"sec-num\">2.1 — Activity · Times of day  ·  ActivityCard.tsx<\u002Fdiv>\n   <h3 class=\"sh\">The daily rhythm<\u002Fh3>\n   <p class=\"sec-sub\">When are birds active today, and what shapes it? <b>Build the tightened baseline.<\u002Fb> Trend lines are smoothed with <b>no point markers<\u002Fb>. Toggle the overlays below — each rides its own labeled axis.<\u002Fp>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this<\u002Fspan><h4>Bars + labeled sky + own-axis overlays<\u002Fh4><span class=\"sub\">detections · toggle diversity &amp; temperature<\u002Fspan><\u002Fdiv><div id=\"act-hour\"><\u002Fdiv><\u002Fdiv>\n   <div class=\"panel before\"><div class=\"opt-h\" style=\"background:none;border:none;padding:0\"><span class=\"opt-k before\">For contrast — the version flagged<\u002Fspan><\u002Fdiv><div id=\"before-act\"><\u002Fdiv><\u002Fdiv>\n   <details class=\"explored\">\n     <summary><span class=\"chev\">▶<\u002Fspan> Also explored — not selected (kept for the record)<\u002Fsummary>\n     <p class=\"ex-note\">Direct Claude Code to the baseline above; these two alternates are here so the thinking is on record.<\u002Fp>\n     <div class=\"ex-grid\">\n       <div class=\"ex-card\"><h5>Option A — 24-hour radial clock<\u002Fh5><div id=\"act-radial\"><\u002Fdiv><\u002Fdiv>\n       <div class=\"ex-card\"><h5>Option B — dawn-chorus stream<\u002Fh5><div id=\"act-stream\"><\u002Fdiv><\u002Fdiv>\n     <\u002Fdiv>\n   <\u002Fdetails>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">2.2 — Activity · Day over day  ·  ActivityCard.tsx<\u002Fdiv>\n   <h3 class=\"sh\">Day to day<\u002Fh3>\n   <p class=\"sec-sub\">How present have birds been across the month? <b>One chart with a toggle — Presence ⇄ Raw detections, default Presence.<\u002Fb> Flip it and watch the bars rise where birds are merely chattier. (Replaces the earlier rejected dotted overlay.)<\u002Fp>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this · try the toggle ↓<\u002Fspan><h4>Presence ⇄ Raw detections<\u002Fh4><\u002Fdiv><div id=\"day-toggle\"><\u002Fdiv><\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">2.3 — Forecast · This week  ·  ForecastWeek.tsx<\u002Fdiv>\n   <h3 class=\"sh\">The week ahead<\u002Fh3>\n   <p class=\"sec-sub\">Expected activity per day with weather behind it. The likely range is drawn as an <b>\"I\" bar<\u002Fb> (capped top <i>and<\u002Fi> bottom); species count above each bar is the diversity read; weather/temp/rain sit in a gutter, off the activity axis.<\u002Fp>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this<\u002Fspan><h4>Expected bars + I-range + weather gutter<\u002Fh4><\u002Fdiv><div id=\"week\"><\u002Fdiv><\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">2.4 — Forecast · A day's shape  ·  ForecastWeek.tsx / day detail<\u002Fdiv>\n   <h3 class=\"sh\">How a single day will go<\u002Fh3>\n   <p class=\"sec-sub\">The expected hour-by-hour curve drawn as what it is — a guess — inside a <b>shaded likely-range band<\u002Fb>, with rain on its own % axis behind it, on the day/night backdrop. (Band version chosen over plain bars.)<\u002Fp>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this<\u002Fspan><h4>Expected curve + likely-range band<\u002Fh4><\u002Fdiv><div id=\"day-band\"><\u002Fdiv><\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">2.5 — Atlas · Reading the soundscape  ·  Atlas.tsx<\u002Fdiv>\n   <h3 class=\"sh\">What the yard sounds like, and what's new<\u002Fh3>\n   <p class=\"sec-sub\">Keep the embedding map for <b>labeling<\u002Fb>. Add three views the data already supports — presence-aware, so the loudest birds don't dominate.<\u002Fp>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this · 5.1<\u002Fspan><h4>Presence ↔ chatter<\u002Fh4><span class=\"sub\">surfaces the false signals<\u002Fspan><\u002Fdiv><div id=\"comp-scatter\"><\u002Fdiv><\u002Fdiv>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this · 5.2<\u002Fspan><h4>Daily rhythm by call type<\u002Fh4><\u002Fdiv><div id=\"heat\"><\u002Fdiv><\u002Fdiv>\n   <div class=\"panel\"><div class=\"opt-h\"><span class=\"opt-k pick\">Build this · 5.3<\u002Fspan><h4>Acoustic novelty<\u002Fh4><\u002Fdiv><div id=\"novelty\"><\u002Fdiv><\u002Fdiv>\n   <details class=\"explored\">\n     <summary><span class=\"chev\">▶<\u002Fspan> Also explored — composition bars (not selected)<\u002Fsummary>\n     <p class=\"ex-note\">The presence-vs-chatter bar list. Good, but the scatter above makes the \"who's a false signal\" read sharper, so we went with that.<\u002Fp>\n     <div class=\"ex-grid\"><div class=\"ex-card\"><h5>5.1 alternate — soundscape composition<\u002Fh5><div id=\"comp-presence\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n   <\u002Fdetails>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">2.6 — Implementation<\u002Fdiv>\n   <h3 class=\"sh\">How to build the charts<\u002Fh3>\n   <div class=\"prose\">\n     <ul>\n       <li>These were prototyped as hand-built SVG to pin down encoding. In production, <b>reuse the app's chart stack<\u002Fb> (<code>recharts<\u002Fcode> via <code>ui.tsx<\u002Fcode>'s <code>CHART_SERIES<\u002Fcode> / <code>ChartTooltip<\u002Fcode>) where it cleanly expresses the spec; drop to custom SVG only for the radial / heatmap / scatter / novelty forms recharts handles poorly.<\u002Fli>\n       <li>Pull colors from <code>ui.tsx<\u002Fcode> tokens — don't introduce new hues. Temperature uses the existing warm/orange token.<\u002Fli>\n       <li>Keep all charts responsive (viewBox + <code>preserveAspectRatio<\u002Fcode> for custom SVG; <code>ResponsiveContainer<\u002Fcode> for recharts).<\u002Fli>\n       <li>Respect <code>prefers-reduced-motion<\u002Fcode>: the day-over-day toggle animation reduces to an instant swap.<\u002Fli>\n     <\u002Ful>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <!-- ===================== PART 3: AVIARY ===================== -->\n <div class=\"part\" id=\"p3\">\n   <div class=\"pe\">Part 3<\u002Fdiv>\n   <h2>The Aviary — an ambient lens on the live feed<\u002Fh2>\n   <p class=\"pd\">The Aviary shows <b>who's in the yard right now<\u002Fb> — each species heard in the rolling last 15 minutes flies in, pecks and hops while it keeps calling, lifts off when it goes quiet. It reads the <b>same live data as the histogram<\u002Fb>, so it lives <b>with<\u002Fb> the live card — surfaced as its expanded, cast-ready view, not as a fifth nav item.<\u002Fp>\n <\u002Fdiv>\n\n <section>\n   <div class=\"av-flow\">\n     <div class=\"av-step\">\n       <div class=\"av-viz\">\n         <div class=\"lc\">\n           <div class=\"lc-h\"><span class=\"lc-live\"><span class=\"lc-dot\"><\u002Fspan>Live<\u002Fspan>\n             <div class=\"lc-seg\"><b class=\"on\">Histogram<\u002Fb><b>Aviary<\u002Fb><\u002Fdiv>\n             <div class=\"lc-exp\"><svg viewBox=\"0 0 24 24\" width=\"11\" height=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n           <\u002Fdiv>\n           <div class=\"histo\"><i style=\"height:30%\"><\u002Fi><i style=\"height:55%\"><\u002Fi><i style=\"height:40%\"><\u002Fi><i style=\"height:80%\"><\u002Fi><i style=\"height:60%\"><\u002Fi><i style=\"height:95%\"><\u002Fi><i style=\"height:45%\"><\u002Fi><i style=\"height:70%\"><\u002Fi><i style=\"height:35%\"><\u002Fi><i style=\"height:58%\"><\u002Fi><i style=\"height:48%\"><\u002Fi><i style=\"height:82%\"><\u002Fi><\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>\n       <div class=\"av-cap\"><div class=\"sn\">Entry<\u002Fdiv><h4>A view toggle on the live card<\u002Fh4><p>The live-card header gains <b>Histogram ⇄ Aviary<\u002Fb> + an expand button. The real sliding histogram stays the default, dense read.<\u002Fp><\u002Fdiv>\n     <\u002Fdiv>\n     <div class=\"av-step\">\n       <div class=\"av-viz\">\n         <div class=\"scene\">\n           <svg class=\"lawn\" viewBox=\"0 0 200 60\"><polygon points=\"100,2 196,30 100,58 4,30\" fill=\"#86bd6a\"><\u002Fpolygon><polygon points=\"4,30 100,58 100,64 4,36\" fill=\"#5e8c46\"><\u002Fpolygon><polygon points=\"196,30 100,58 100,64 196,36\" fill=\"#699a52\"><\u002Fpolygon><\u002Fsvg>\n           <div class=\"av-bird\" style=\"left:38%;top:46%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:60%;top:54%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:50%;top:62%\">🐦<\u002Fdiv>\n           <div class=\"tag\" style=\"left:38%;top:44%\">House Finch<\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>\n       <div class=\"av-cap\"><div class=\"sn\">Default in-card<\u002Fdiv><h4>The scene, in place<\u002Fh4><p>Switch to Aviary and the same present-species set renders as the voxel yard. Tap a bird to identify it. Scope and data are unchanged — only the representation.<\u002Fp><\u002Fdiv>\n     <\u002Fdiv>\n     <div class=\"av-step\">\n       <div class=\"av-viz\">\n         <div class=\"scene\">\n           <span class=\"cast-badge\">⤢ Fullscreen · cast<\u002Fspan>\n           <svg class=\"lawn\" style=\"width:88%;height:64px\" viewBox=\"0 0 200 60\"><polygon points=\"100,2 196,30 100,58 4,30\" fill=\"#86bd6a\"><\u002Fpolygon><polygon points=\"4,30 100,58 100,64 4,36\" fill=\"#5e8c46\"><\u002Fpolygon><polygon points=\"196,30 100,58 100,64 196,36\" fill=\"#699a52\"><\u002Fpolygon><\u002Fsvg>\n           <div class=\"av-bird\" style=\"left:30%;top:42%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:52%;top:50%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:68%;top:46%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:44%;top:60%\">🐦<\u002Fdiv>\n           <div class=\"av-bird\" style=\"left:62%;top:64%\">🐦<\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>\n       <div class=\"av-cap\"><div class=\"sn\">Signature use<\u002Fdiv><h4>Fullscreen ambient / cast<\u002Fh4><p>Expand opens it full-bleed with chrome minimized — made to be left running on a tablet, second screen, or TV. Tap to exit.<\u002Fp><\u002Fdiv>\n     <\u002Fdiv>\n   <\u002Fdiv>\n\n   <div class=\"av-detail\">\n     <h4>How it behaves<\u002Fh4>\n     <div class=\"av-points\">\n       <div class=\"avp\"><span class=\"n\">01<\u002Fspan><div><b>Same data as the live card<\u002Fb><span>Driven by the rolling-15-min present-species set from the live source — no new data, just a second representation.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n       <div class=\"avp\"><span class=\"n\">02<\u002Fspan><div><b>Scope-coupled<\u002Fb><span>Requires a live (always-on) device in scope, like the histogram. Default Yard · Yard Mic makes it always available; changing Location/Device repoints it.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n       <div class=\"avp\"><span class=\"n\">03<\u002Fspan><div><b>Quiet-yard empty state<\u002Fb><span>Heard nothing in 15 min? A calm empty yard with a \"listening…\" note — a better idle than a flat-lined histogram.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n       <div class=\"avp\"><span class=\"n\">04<\u002Fspan><div><b>Mobile = fullscreen takeover<\u002Fb><span>Opens from the live card, not a bottom tab. Side panel (\"in the yard now\" + controls) drops under the scene below 820px.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <\u002Fdiv>\n     <div class=\"engine-note\"><span>🛠<\u002Fspan><div><b>The engine is already built — reuse it.<\u002Fb> <code>aviary-voxel.js<\u002Fcode> (renderer + species library) and <code>aviary.js<\u002Fcode> (scene engine + <code>window.Aviary<\u002Fcode> API) are production-ready. Turn off the demo spawner with <code>Aviary.simulate(false)<\u002Fcode> and feed live data with <code>Aviary.setPresent([...ids])<\u002Fcode> (the rolling-15-min present set; the engine reconciles birds in and out). Port only the surrounding chrome — don't rebuild the renderer or bird models.<\u002Fdiv><\u002Fdiv>\n     <div class=\"callout-row\"><span>✎<\u002Fspan><div><b>Naming.<\u002Fb> \"Aviary\" / \"Live Aviary\" reads well as \"your birds, live\" and needs no nav label of its own. If a more literal name is ever wanted, \"The Yard\" / \"Live Yard\" maps directly to the scene.<\u002Fdiv><\u002Fdiv>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <!-- ===================== PART 4: BUILD ORDER ===================== -->\n <div class=\"part\" id=\"p4\">\n   <div class=\"pe\">Part 4<\u002Fdiv>\n   <h2>Build order &amp; handoff notes<\u002Fh2>\n   <p class=\"pd\">One path through all three strands, plus the corrections to carry from earlier rounds.<\u002Fp>\n <\u002Fdiv>\n\n <section>\n   <div class=\"sec-num\">4.1 — Sequencing<\u002Fdiv>\n   <h3 class=\"sh\">Build order<\u002Fh3>\n   <div class=\"build\">\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Responsive shell<\u002Fb><span>Sidebar (web) / top-bar + tabs (mobile); wire the persistent Location · Device · Time scope to existing state/query params.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Home + live card<\u002Fb><span>Reorganize the dashboard; integrate the real histogram (Listen + Live inside, drop top-bar duplicates); add the Histogram ⇄ Aviary toggle + expand.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Recent (presence)<\u002Fb><span>15-min-window collapse, latest-time sort, pagination.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Birds review + bird detail<\u002Fb><span>Status segmented at top (Confirmed default); global scope; expandable detection rows; per-bird recording mode.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Charts<\u002Fb><span>Times-of-day (no dots), day-over-day presence toggle, week \"I\"-range, day-shape band — over real model output.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Atlas<\u002Fb><span>Keep the embedding map for labeling; add the three soundscape insight views.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Aviary<\u002Fb><span>Port chrome around the reused engine; wire setPresent to the live source; fullscreen/cast + quiet-yard state.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n     <div class=\"bstep\"><span class=\"bn\"><\u002Fspan><div><b>Recordings, Settings, Locations/Devices<\u002Fb><span>Minimal inline-edit lists; no per-item dashboards.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <div class=\"closing\">\n   <h2>What changed from earlier rounds<\u002Fh2>\n   <p class=\"sub\">So prior code is corrected, not re-added.<\u002Fp>\n   <div class=\"specrow\"><div class=\"sk\">Charts<\u002Fdiv><div class=\"sv\">\"Weather\" line → <b>Temperature<\u002Fb>, labeled, own axis · diversity → <b>own labeled species/hr axis<\u002Fb> (was floating) · unlabeled rainbow band → <b>labeled sky backdrop + Sunrise/Sunset markers<\u002Fb> · trend lines → <b>no point dots<\u002Fb>.<\u002Fdiv><\u002Fdiv>\n   <div class=\"specrow\"><div class=\"sk\">Day over day<\u002Fdiv><div class=\"sv\">Dotted detection overlay → <b>removed<\u002Fb>, replaced by the <b>presence ⇄ detections toggle<\u002Fb> (default presence).<\u002Fdiv><\u002Fdiv>\n   <div class=\"specrow\"><div class=\"sk\">Week<\u002Fdiv><div class=\"sv\">Range → <b>\"I\" bar<\u002Fb> (capped both ends), not a top-only \"T\".<\u002Fdiv><\u002Fdiv>\n   <div class=\"specrow\"><div class=\"sk\">Labels &amp; tone<\u002Fdiv><div class=\"sv\">\"spp\" → <b>\"species\"<\u002Fb> · emoji/glyphs → <b>Lucide<\u002Fb> · cute/prescriptive copy → <b>removed<\u002Fb>.<\u002Fdiv><\u002Fdiv>\n   <div class=\"specrow\"><div class=\"sk\">Aviary<\u002Fdiv><div class=\"sv\">Positioned as the <b>live card's expanded ambient view<\u002Fb>, not a standalone screen or extra nav section.<\u002Fdiv><\u002Fdiv>\n   <p class=\"note-ph\">A design spec ported onto the real codebase — keep the existing component library, data layer and routing. Sample numbers in the live charts are illustrative; production already yields real presence, richness, environment and embeddings. This prescribes structure, encoding and placement, not values.<\u002Fp>\n <\u002Fdiv>\n\n<\u002Fdiv>\n\n<script src=\"2b62491b-f4e1-42ff-a8b6-4cc0928779d2\"><\u002Fscript>\n<script src=\"d3465714-aa67-4304-9b9c-e8d18b4dcb51\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
