  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:2px;gap:2px}\n.lc-seg b{font-size:9px;font-weight:600;padding:3px 7px;border-radius:5px;color:var(--muted)}\n.lc-seg b.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}\n.lc-exp{width:18px;height:18px;border-radius:5px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted)}\n.histo{flex:1;display:flex;align-items:flex-end;gap:2px;padding-top:3px}\n.histo i{flex:1;background:linear-gradient(var(--blue),color-mix(in srgb,var(--blue) 45%,transparent));border-radius:2px 2px 0 0;display:block}\n.scene{position:absolute;inset:0;background:linear-gradient(180deg,#a3d2f4,#cdebfb)}\n.lawn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:78%;height:54px}\n.av-bird{position:absolute;font-size:13px}\n.scene .tag{position:absolute;background:rgba(15,16,24,.72);color:#fff;font-size:8px;font-weight:600;padding:1px 6px;border-radius:999px;white-space:nowrap;transform:translate(-50%,-100%)}\n.cast-badge{position:absolute;top:9px;left:9px;font-size:8.5px;font-family:var(--mono);background:rgba(15,16,24,.6);color:#fff;padding:2px 7px;border-radius:999px}\n.av-detail{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px}\n.av-detail h4{margin:0 0 14px;font-size:15px}\n.av-points{display:grid;grid-template-columns:1fr 1fr;gap:14px 28px}\n@media(max-width:600px){.av-points{grid-template-columns:1fr}}\n.avp{display:flex;gap:11px;align-items:flex-start}\n.avp .n{font-family:var(--mono);font-size:11px;color:var(--accent);flex:0 0 auto;padding-top:2px}\n.avp b{display:block;font-size:13.5px;margin-bottom:2px}\n.avp span{font-size:12.5px;color:var(--muted);line-height:1.5}\n.callout-row{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:13px 15px;border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 26%,transparent);font-size:13px}\n.callout-row b{color:var(--fg)}\n.engine-note{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:13px 15px;border-radius:12px;background:color-mix(in srgb,var(--lawn) 10%,transparent);border:1px dashed color-mix(in srgb,var(--lawn) 40%,transparent);font-size:13px}\n.engine-note code{font-family:var(--mono);font-size:12px;background:var(--card);padding:1px 6px;border-radius:5px;color:#3d7a2e}\n\n/* build order */\n.build{counter-reset:b;display:grid;grid-template-columns:1fr 1fr;gap:10px}\n@media(max-width:680px){.build{grid-template-columns:1fr}}\n.bstep{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 15px}\n.bstep .bn{counter-increment:b;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--accent);width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:0 0 auto}\n.bstep .bn::before{content:counter(b)}\n.bstep b{font-size:13.5px}.bstep span{font-size:12.5px;color:var(--muted);display:block;margin-top:1px}\n\n/* closing */\n.closing{background:var(--fg);color:#f4f4f8;border-radius:20px;padding:36px 40px;margin-top:30px}\n.closing h2{color:#fff;font-size:24px;margin:0 0 8px;letter-spacing:-.02em}\n.closing p.sub{color:#b9b9c8;font-size:14px;margin:0 0 22px}\n.specrow{display:grid;grid-template-columns:130px 1fr;gap:14px 22px;border-top:1px solid #33333f;padding:16px 0}\n.specrow:last-of-type{border-bottom:1px solid #33333f}\n.specrow .sk{font-family:var(--mono);font-size:12px;color:#b6a6f5;padding-top:2px}\n.specrow .sv{font-size:13.5px;color:#dcdce4;line-height:1.5}\n.specrow .sv b{color:#fff;font-weight:600}\n.note-ph{font-family:var(--mono);font-size:11px;color:#8a8a9c;margin-top:26px}\n\n@media(max-width:680px){h1{font-size:33px}.part h2{font-size:27px}.wrap{padding:40px 16px 80px}\n .specrow{grid-template-columns:1fr}.ws-grid{grid-template-columns:repeat(4,1fr)}.pc-head,.pc-row{grid-template-columns:120px 1fr 66px}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"wrap\">\n\n <!-- ===================== MASTHEAD ===================== -->\n <p class=\"kicker\">Birds · complete redesign handoff · for Claude Code<\u002Fp>\n <h1>The whole redesign in one document: structure, charts, and the Aviary.<\u002Fh1>\n <p class=\"lede\">Everything decided across the redesign, integrated and self-contained — nothing references a file you can't see. <b>Part 1<\u002Fb> is the app's structure and navigation. <b>Part 2<\u002Fb> is every chart, rendered live and interactive right here. <b>Part 3<\u002Fb> places the Aviary. Two ideas run through all of it: <b>presence over chatter<\u002Fb>, and <b>one question per surface.<\u002Fb><\u002Fp>\n <div class=\"byline\">\n   <span><b>Nav<\u002Fb> Home · Birds · Forecast · Atlas<\u002Fspan>\n   <span><b>Charts<\u002Fb> 6 surfaces, presence-first<\u002Fspan>\n   <span><b>Aviary<\u002Fb> lens on the live card<\u002Fspan>\n   <span><b>Status<\u002Fb> design spec → port onto real codebase<\u002Fspan>\n <\u002Fdiv>\n\n <div class=\"toc\">\n   <a href=\"#p0\"><span class=\"tn\">0<\u002Fspan><span><b>The two governing ideas<\u002Fb><span>Presence over chatter · one question per surface<\u002Fspan><\u002Fspan><\u002Fa>\n   <a href=\"#p1\"><span class=\"tn\">1<\u002Fspan><span><b>Structure — IA &amp; navigation<\u002Fb><span>The map, scope, page-by-page<\u002Fspan><\u002Fspan><\u002Fa>\n   <a href=\"#p2\"><span class=\"tn\">2<\u002Fspan><span><b>Charts &amp; data-viz (live)<\u002Fb><span>All 6 charts, rendered &amp; interactive<\u002Fspan><\u002Fspan><\u002Fa>\n   <a href=\"#p3\"><span class=\"tn\">3<\u002Fspan><span><b>The Aviary<\u002Fb><span>What it is &amp; where it lives<\u002Fspan><\u002Fspan><\u002Fa>\n   <a href=\"#p4\"><span class=\"tn\">4<\u002Fspan><span><b>Build order &amp; handoff notes<\u002Fb><span>Sequencing · what changed<\u002Fspan><\u002Fspan><\u002Fa>\n <\u002Fdiv>\n\n <!-- ===================== PART 0 ===================== -->\n <div class=\"part\" id=\"p0\">\n   <div class=\"pe\">Part 0<\u002Fdiv>\n   <h2>Two ideas govern everything<\u002Fh2>\n   <p class=\"pd\">Every page and every chart in this document follows these two principles. They are the reason for the specific encodings that follow.<\u002Fp>\n <\u002Fdiv>\n <div class=\"strands\">\n   <div class=\"strand\"><div class=\"sn\">Idea 1<\u002Fdiv><h4>Presence over chatter<\u002Fh4><p>A bird that vocalizes constantly is <b>not<\u002Fb> more significant than a quiet bird that's reliably around — raw detection counts over-weight the talkers and create false signals. The headline measure everywhere is <b>presence = the number of 15-minute windows a species was detected in<\u002Fb> (≥1 detection counts once; no bonus for volume). Raw detections stay available, never dominant.<\u002Fp><\u002Fdiv>\n   <div class=\"strand\"><div class=\"sn\">Idea 2<\u002Fdiv><h4>One question per surface<\u002Fh4><p>Each page and each chart answers a single thing fast; everything else is layered or one tap away, never stacked on top. Home is settled truth, Birds is review, Recent is presence, each chart has one reading.<\u002Fp><\u002Fdiv>\n   <div class=\"strand\"><div class=\"sn\">Constant<\u002Fdiv><h4>One app, two chromes<\u002Fh4><p>A single responsive application: a left sidebar on web, top-bar + bottom tabs on mobile. A persistent <b>Location · Device · Time<\u002Fb> scope applies on every page. Keep the existing component library, data layer and routing — this ports structure, encoding and behavior onto the real codebase.<\u002Fp><\u002Fdiv>\n <\u002Fdiv>\n\n <!-- ===================== PART 1: STRUCTURE ===================== -->\n <div class=\"part\" id=\"p1\">\n   <div class=\"pe\">Part 1<\u002Fdiv>\n   <h2>Structure — IA &amp; navigation<\u002Fh2>\n   <p class=\"pd\">How the app is organized: the navigation map, the global scope, and what each page is for.<\u002Fp>\n <\u002Fdiv>\n\n <section>\n   <div class=\"sec-num\">1.1 — The map<\u002Fdiv>\n   <h3 class=\"sh\">Where everything lives<\u002Fh3>\n   <p class=\"sec-sub\">Primary nav stays four items — <b>Home · Birds · Forecast · Atlas<\u002Fb>. Charts live inside their pages; the Aviary launches from Home's live card, not as a fifth destination.<\u002Fp>\n   <div class=\"map\">\n     <div class=\"map-chromes\">\n       <div class=\"chrome\">\n         <div class=\"chrome-h\">Web ≥920px · left sidebar<\u002Fdiv>\n         <div class=\"chrome-b\">\n           <div class=\"navset\">\n             <div class=\"navrow prim\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><\u002Fsvg>Home<span class=\"tag\">live card → Aviary · Recent · Activity<\u002Fspan><\u002Fdiv>\n             <div class=\"navrow prim\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"><\u002Fline><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"><\u002Fline><\u002Fsvg>Birds<span class=\"tag\">review surface<\u002Fspan><\u002Fdiv>\n             <div class=\"navrow prim\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>Forecast<span class=\"tag\">2 charts<\u002Fspan><\u002Fdiv>\n             <div class=\"navrow prim\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4.5\" r=\"2.5\"><\u002Fcircle><circle cx=\"5\" cy=\"14\" r=\"2.5\"><\u002Fcircle><circle cx=\"19\" cy=\"14\" r=\"2.5\"><\u002Fcircle><path d=\"M12 7v3M10.5 12 6.8 13.2M13.5 12l3.7 1.2\"><\u002Fpath><\u002Fsvg>Atlas<span class=\"tag\">map + 3 insights<\u002Fspan><\u002Fdiv>\n           <\u002Fdiv>\n           <div class=\"divlabel\">Manage<\u002Fdiv>\n           <div class=\"navset\">\n             <div class=\"navrow manage\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>Locations<\u002Fdiv>\n             <div class=\"navrow manage\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"5\" y=\"2\" width=\"14\" height=\"20\" rx=\"2\"><\u002Frect><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"18\"><\u002Fline><\u002Fsvg>Devices<\u002Fdiv>\n             <div class=\"navrow manage\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 13v-2M6 17V7M10 21V3M14 17V7M18 14v-4M22 13v-2\"><\u002Fpath><\u002Fsvg>Recordings<\u002Fdiv>\n             <div class=\"navrow manage\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-2.82 1.17V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15H4.5a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 6.2 9.4\"><\u002Fpath><\u002Fsvg>Settings<\u002Fdiv>\n           <\u002Fdiv>\n           <div class=\"scopebar\">\n             <span class=\"scopechip\">Location · Yard ★<\u002Fspan>\n             <span class=\"scopechip\">Device · Yard Mic ●<\u002Fspan>\n             <span class=\"scopechip\">Time · 30 days<\u002Fspan>\n           <\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>\n       <div class=\"chrome\">\n         <div class=\"chrome-h\">Mobile &lt;920px · bottom tabs<\u002Fdiv>\n         <div class=\"chrome-b\">\n           <div class=\"scopebar\" style=\"margin-top:0;padding-top:0;border:none;margin-bottom:14px\">\n             <span class=\"scopechip\">Yard ★<\u002Fspan><span class=\"scopechip\">Yard Mic ●<\u002Fspan><span class=\"scopechip\">30 days<\u002Fspan>\n           <\u002Fdiv>\n           <div style=\"font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.55\">Top filter bar carries the same <b>Location · Device · Time<\u002Fb> scope. Recordings, Settings, Locations &amp; Devices fold under <b>More<\u002Fb>.<\u002Fdiv>\n           <div class=\"tabrow\">\n             <div class=\"tabitem on\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><\u002Fsvg>Home<\u002Fdiv>\n             <div class=\"tabitem\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"8\" y1=\"6\" x2=\"21\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"8\" y1=\"18\" x2=\"21\" y2=\"18\"><\u002Fline><line x1=\"3\" y1=\"6\" x2=\"3.01\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"3.01\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"3.01\" y2=\"18\"><\u002Fline><\u002Fsvg>Birds<\u002Fdiv>\n             <div class=\"tabitem\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"18\" rx=\"2\"><\u002Frect><line x1=\"16\" y1=\"2\" x2=\"16\" y2=\"6\"><\u002Fline><line x1=\"8\" y1=\"2\" x2=\"8\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"10\" x2=\"21\" y2=\"10\"><\u002Fline><\u002Fsvg>Forecast<\u002Fdiv>\n             <div class=\"tabitem\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"4.5\" r=\"2.5\"><\u002Fcircle><circle cx=\"5\" cy=\"14\" r=\"2.5\"><\u002Fcircle><circle cx=\"19\" cy=\"14\" r=\"2.5\"><\u002Fcircle><path d=\"M12 7v3M10.5 12 6.8 13.2M13.5 12l3.7 1.2\"><\u002Fpath><\u002Fsvg>Atlas<\u002Fdiv>\n             <div class=\"tabitem\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"5\" cy=\"12\" r=\"1.6\"><\u002Fcircle><\u002Fsvg>More<\u002Fdiv>\n           <\u002Fdiv>\n           <div style=\"font-size:12px;color:var(--faint);margin-top:12px;line-height:1.5\">The <b>Aviary<\u002Fb> opens as a fullscreen takeover from the Home live card — never its own tab.<\u002Fdiv>\n         <\u002Fdiv>\n       <\u002Fdiv>\n     <\u002Fdiv>\n     <div class=\"maplegend\">\n       <span><span class=\"kbox prim\"><\u002Fspan> Primary nav<\u002Fspan>\n       <span><span class=\"kbox chart\"><\u002Fspan> Charts live inside pages<\u002Fspan>\n       <span><span class=\"kbox av\"><\u002Fspan> Aviary = live-card lens<\u002Fspan>\n     <\u002Fdiv>\n   <\u002Fdiv>\n <\u002Fsection>\n\n <section>\n   <div class=\"sec-num\">1.2 — The working prototype<\u002Fdiv>\n   <h3 class=\"sh\">The full app redesign, live<\u002Fh3>\n   <p class=\"sec-sub\">This is uot;.5&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--cat-blue)&quot; stop-opacity=&quot;.05&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;\n       &lt;path d=&quot;${d} L${X(n-1).toFixed(2)},100 L${X(0).toFixed(2)},100 Z&quot; fill=&quot;url(#r${gid})&quot;/&gt;\n       &lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;var(--cat-blue)&quot; stroke-width=&quot;1.6&quot; vector-effect=&quot;non-scaling-stroke&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n     &lt;span class=&quot;ch-rain-max&quot;&gt;${rmaxV}%&lt;/span&gt;&lt;/div&gt;`;\n }\n const iv=o.xinterval||1;\n const xl=bars.map((b,i)=&gt;`&lt;span&gt;${(i%iv===0||i===n-1)?b.label:''}&lt;/span&gt;`).join('');\n return `&lt;div class=&quot;ch ${o.rightAxis?'has-r':''}&quot;&gt;\n   &lt;div class=&quot;ch-plot&quot;&gt;&lt;div class=&quot;ch-area&quot; style=&quot;height:${H}px&quot;&gt;\n     ${daylight}\n     &lt;div class=&quot;ch-grid&quot;&gt;${grid}&lt;/div&gt;\n     &lt;div class=&quot;ch-cols&quot;&gt;${cols}&lt;/div&gt;${mk}\n     &lt;svg class=&quot;ch-ovl&quot; viewBox=&quot;0 0 100 100&quot; preserveAspectRatio=&quot;none&quot;&gt;&lt;defs&gt;${defs}&lt;/defs&gt;${svgline}&lt;/svg&gt;${rlab}\n   &lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;ch-x&quot;&gt;${xl}&lt;/div&gt;${rain}${o.legend||''}&lt;/div&gt;`;\n}\nfunction legtog(on,color,dashed,label,range,fn){\n return `&lt;button class=&quot;legtog ${on?'on':'off'}&quot; onclick=&quot;${fn}&quot;&gt;&lt;span class=&quot;linec&quot; style=&quot;border-color:${color};${dashed?'border-top-style:dashed':''}&quot;&gt;&lt;/span&gt;${label}${range?`&lt;span class=&quot;lgr&quot;&gt;${range}&lt;/span&gt;`:''}&lt;/button&gt;`;\n}\n\n// Activity card — Per-day ↔ Times-of-day, day drill-down, diversity + weather layers.\nlet actDrill=null; // absolute index into DAILYD, or null\nfunction activityChart(opts){\n opts=opts||{};\n const noDiv=!!opts.noDiv;\n const layerCtl=()=&gt;`&lt;div class=&quot;legrow&quot;&gt;\n   ${noDiv?'':legtog(showDiv,'var(--cat-orchid)',false,'Diversity','species/hr',&quot;toggleLayer('div')&quot;)}\n   ${legtog(showWx,'var(--cat-slate)',true,'Weather','°F',&quot;toggleLayer('wx')&quot;)}&lt;/div&gt;`;\n const useDiv=showDiv&amp;&amp;!noDiv;\n const hourly=(base,sub,crumb)=&gt;{\n   const lines=useDiv?[{vals:DIVERSITY,color:'var(--cat-orchid)',axis:'auto'}]:[];\n   const body=chart({bars:base.map((v,i)=&gt;({v,label:hh(i)})), height:opts.h||176, xinterval:6,\n     area:{vals:base,color:'var(--cat-blue)'}, daylight:{sr:6,ss:20},\n     markers:[{x:6,ic:'sunrise'},{x:20,ic:'sunset'}], lines, rightAxis: showWx?{vals:TEMP,fmt:v=&gt;v+'°'}:null,\n     tip:(i)=&gt;`${hh(i)} · &lt;b&gt;${base[i]}&lt;/b&gt; det${base[i]===1?'':'s'}${useDiv?` · ${DIVERSITY[i]} spp`:''}${showWx?` · ${TEMP[i]}°F`:''}`});\n   return `&lt;div class=&quot;card lchart&quot;&gt;${crumb||''}&lt;div class=&quot;lhd&quot;&gt;&lt;span class=&quot;lt&quot;&gt;${svg('sunrise',16,2)} Activity&lt;/span&gt;${layerCtl()}&lt;/div&gt;${body}\n     &lt;p class=&quot;muted&quot; style=&quot;font-size:10.5px;margin:9px 0 0&quot;&gt;${sub}&lt;/p&gt;&lt;/div&gt;`;\n };\n if(actDrill!=null){ const d=DAILYD[actDrill], lbl=`${WKD[d.date.getDay()]} ${MON[d.date.getMonth()]} ${d.date.getDate()}`;\n   return hourly(dayHourly(actDrill), `Hour-by-hour on ${lbl} (confirmed). Diversity = species richness per hour; weather = temperature.`,\n     `&lt;button class=&quot;ch-crumb&quot; onclick=&quot;actDrill=null;render()&quot;&gt;${svg('chevL',13,2)} Back to ${TIME_LABEL[timeScope]}&lt;/button&gt;`); }\n if(timeScope==='hours') return hourly(ACTIVITY, 'Average detections per hour across the range (confirmed). Dawn/dusk marked; toggle diversity &amp; weather overlays.');\n if(timeScope==='Today') return hourly(ACTIVITY, &quot;Today's detections by hour (confirmed). Dawn/dusk marked; toggle diversity &amp; weather overlays.&quot;);\n const days=timeScope==='7d'?7:30, slice=DAILYD.slice(-days), offset=DAILYD.length-slice.length;\n const peak=Math.max(...slice.map(d=&gt;d.count));\n const body=chart({bars:slice.map(d=&gt;({v:d.count,label:`${d.date.getMonth()+1}/${d.date.getDate()}`,peak:d.count===peak})),\n   height:opts.h||168, xinterval: days&lt;=7?1:6, onBar:`actDrillAbs($I,${offset})`,\n   tip:(i,b)=&gt;`${WKD[slice[i].date.getDay()]} ${b.label} · &lt;b&gt;${b.v}&lt;/b&gt; dets — tap for hours`});\n return `&lt;div class=&quot;card lchart&quot;&gt;&lt;div class=&quot;lhd&quot;&gt;&lt;span class=&quot;lt&quot;&gt;${svg('sunrise',16,2)} Activity&lt;/span&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;detections / day · confirmed&lt;/span&gt;&lt;/div&gt;${body}\n   &lt;p class=&quot;muted&quot; style=&quot;font-size:10.5px;margin:9px 0 0&quot;&gt;Detections per day over ${TIME_LABEL[timeScope]} (confirmed). &lt;b style=&quot;color:var(--fg)&quot;&gt;Tap any day&lt;/b&gt; to drill into its hours; switch Time to &lt;b style=&quot;color:var(--fg)&quot;&gt;Times of day&lt;/b&gt; for the hourly average with diversity &amp; weather.&lt;/p&gt;&lt;/div&gt;`;\n}\nfunction actDrillAbs(i,off){actDrill=off+i;render()}\n\n/* ===================================================================== HOME */\nfunction Home(){\n const p=PLACES[cur], conf=SPECIES[cur].confirmed, dv=dvObj();\n const liveBlock=isLive()?liveCard(dv&amp;&amp;dv.alwaysOn?dv.name:(listening?'This iPhone':p.name)):listenHint();\n const recent=`\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('radio',14,2)} Recent ${isLive()?'· live':''}&lt;span class=&quot;sr&quot; onclick=&quot;go('birds')&quot;&gt;All birds ${svg('chevR',13,2.2)}&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;seg full&quot; id=&quot;nowseg&quot; style=&quot;margin-bottom:8px&quot;&gt;${['15m','1h','Today'].map(w=&gt;`&lt;button class=&quot;${nowWindow===w?'on':''}&quot; onclick=&quot;setWin('${w}')&quot;&gt;${w}&lt;/button&gt;`).join('')}&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 13px&quot; id=&quot;recentcard&quot;&gt;${recentList()}&lt;/div&gt;\n   &lt;p class=&quot;muted&quot; style=&quot;font-size:10.5px;margin:7px 2px 0&quot;&gt;Each species once — sorted by most recent. Presence = how many 15-min windows it appeared in, not raw chirp count.&lt;/p&gt;`;\n const sideForecast=`&lt;div class=&quot;seclabel&quot;&gt;${svg('sun',14,2)} Forecast&lt;span class=&quot;sr&quot; onclick=&quot;go('forecast')&quot;&gt;7-day ${svg('chevR',13,2.2)}&lt;/span&gt;&lt;/div&gt;${forecastMini()}`;\n const sideActivity=activityChart({h:120});\n const topBirds=`&lt;div class=&quot;seclabel&quot;&gt;${svg('list',14,2)} Top birds${curDev!=='all'?' · '+devName(curDev):''}&lt;span class=&quot;sr&quot; onclick=&quot;go('birds')&quot;&gt;All ${p.confirmed} ${svg('chevR',13,2.2)}&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 13px&quot;&gt;&lt;div class=&quot;splist&quot;&gt;${conf.slice(0,4).map(s=&gt;sprow(s,'confirmed',false)).join('')}&lt;/div&gt;&lt;/div&gt;`;\n const statsBlock=`&lt;div class=&quot;seclabel&quot;&gt;${svg('target',14,2)} At a glance&lt;span class=&quot;nt&quot;&gt;confirmed&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;stats&quot;&gt;${stat(p.confirmed,'Species')}${stat(p.detections.toLocaleString(),'Detections')}${stat(p.today,'Today')}${stat(p.activeDays,'Active days')}&lt;/div&gt;`;\n return `${liveBlock}\n   &lt;div class=&quot;dash&quot;&gt;\n     &lt;div class=&quot;col-main&quot;&gt;${recent}&lt;div style=&quot;height:10px&quot;&gt;&lt;/div&gt;${activityChart({h:130})}&lt;/div&gt;\n     &lt;div class=&quot;col-rail&quot;&gt;${sideForecast}${statsBlock}${topBirds}&lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Opens on home + always-on.&lt;/b&gt; The app starts scoped to your home location (Yard ★) and its always-on mic (Yard Mic ●). Location · Device · Time live in the toolbar and persist on every page. &lt;span class=&quot;ph-flag&quot;&gt;${svg('spark',10,2)} placeholder&lt;/span&gt; the live histogram is a stand-in — your real one slides left with per-bird icons.&lt;/div&gt;`;\n}\nfunction recentList(){\n let rows=PRESENCE.filter(r=&gt;{\n   if(nowWindow==='15m')return r.latest&gt;=NOWMIN-15;\n   if(nowWindow==='1h')return r.latest&gt;=NOWMIN-60;\n   return true;\n }).slice().sort((a,b)=&gt;b.latest-a.latest);\n const per=10, pages=Math.max(1,Math.ceil(rows.length/per));\n if(recentPage&gt;=pages)recentPage=0;\n const page=rows.slice(recentPage*per,recentPage*per+per);\n const body=page.map(r=&gt;presenceRow(r)).join('') || `&lt;p class=&quot;muted&quot; style=&quot;padding:16px 0;text-align:center;font-size:13px&quot;&gt;Nothing in this window.&lt;/p&gt;`;\n const pager = rows.length&gt;per?`&lt;div class=&quot;pager&quot;&gt;&lt;button onclick=&quot;pageRecent(-1)&quot; ${recentPage===0?'disabled':''}&gt;${svg('chevL',15,2)}&lt;/button&gt;&lt;span&gt;${recentPage+1} / ${pages} · ${rows.length} species&lt;/span&gt;&lt;button onclick=&quot;pageRecent(1)&quot; ${recentPage&gt;=pages-1?'disabled':''}&gt;${svg('chevR',15,2)}&lt;/button&gt;&lt;/div&gt;`:'';\n return body+pager;\n}\nfunction presenceRow(r){\n const now=r.latest&gt;=NOWMIN-15;\n let strip='';\n for(let h=0;h&lt;24;h++){const inr=h&gt;=r.fh&amp;&amp;h&lt;=r.lh; const lit=inr&amp;&amp;(hash(r.sp+h)%3!==0); const isnow=h===Math.floor(r.latest/60)&amp;&amp;now; strip+=`&lt;i class=&quot;${isnow?'now':lit?'on':''}&quot;&gt;&lt;/i&gt;`}\n let meta;\n if(nowWindow==='15m') meta=`&lt;span class=&quot;pwin&quot;&gt;${now?'heard just now':'recently'}&lt;/span&gt;`;\n else if(nowWindow==='1h') meta=`&lt;span class=&quot;pwin&quot;&gt;present in ${Math.min(4,Math.ceil(r.win/3))} of last 4 × 15-min&lt;/span&gt;`;\n else meta=`&lt;div class=&quot;pstrip&quot;&gt;${strip}&lt;/div&gt;&lt;span class=&quot;pwin&quot;&gt;${r.win} × 15-min · since ${tmin(r.fh*60)}&lt;/span&gt;`;\n return `&lt;div class=&quot;prow&quot; onclick=&quot;openBird('${r.sp.replace(/'/g,&quot;\\\\'&quot;)}','${r.sci}')&quot;&gt;\n   ${thumb(r.sci,38)}\n   &lt;span class=&quot;nm&quot;&gt;&lt;b&gt;${r.sp} ${r.new?'&lt;span class=&quot;pill new&quot;&gt;'+svg('spark',10,2)+'New&lt;/span&gt;':''}&lt;/b&gt;&lt;div class=&quot;pmeta&quot;&gt;${meta}&lt;/div&gt;&lt;/span&gt;\n   &lt;span class=&quot;latest&quot;&gt;&lt;b&gt;${tmin(r.latest)}&lt;/b&gt;&lt;span&gt;${now?'now':'latest'}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`;\n}\nfunction liveCard(name){\n return `&lt;div class=&quot;card live&quot; style=&quot;margin-top:4px&quot;&gt;\n   &lt;div class=&quot;lhead&quot;&gt;&lt;span class=&quot;liveflag&quot;&gt;&lt;span class=&quot;live-dot&quot;&gt;&lt;/span&gt;Live&lt;/span&gt;&lt;span class=&quot;lt&quot;&gt;${svg('radio',16,2)} ${name}&lt;/span&gt;\n     &lt;button class=&quot;btn sm ${listening?'':'primary'}&quot; style=&quot;margin-left:auto&quot; onclick=&quot;toggleListen()&quot;&gt;${listening?svg('stop',13,2)+' Stop':svg('mic',13,2)+' Listen here'}&lt;/button&gt;&lt;/div&gt;\n   &lt;div class=&quot;specwrap&quot;&gt;&lt;div class=&quot;spectro&quot; id=&quot;spectro&quot;&gt;${Array.from({length:54}).map(()=&gt;'&lt;i style=&quot;height:3px&quot;&gt;&lt;/i&gt;').join('')}&lt;/div&gt;\n     &lt;div class=&quot;birdlane&quot; id=&quot;birdlane&quot;&gt;&lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;hearing&quot;&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11.5px&quot;&gt;Now hearing:&lt;/span&gt;${NOW_HEARING.map(h=&gt;`&lt;span class=&quot;pill ok&quot;&gt;${h[0]} ${Math.round(h[1]*100)}%&lt;/span&gt;`).join('')}&lt;/div&gt;&lt;/div&gt;`;\n}\nfunction listenHint(){return `&lt;div class=&quot;card&quot; style=&quot;padding:13px;margin-top:4px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)&quot;&gt;\n   &lt;div class=&quot;row&quot;&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;${svg('mic',18,1.9)}&lt;/span&gt;&lt;span style=&quot;flex:1;font-size:13px&quot;&gt;No always-on mic in scope. &lt;button class=&quot;btn sm primary&quot; onclick=&quot;toggleListen()&quot; style=&quot;margin-left:6px&quot;&gt;${svg('mic',13,2)} Listen here&lt;/button&gt; or switch the device filter to one that's always on.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`}\nfunction forecastMini(){return `&lt;div class=&quot;card fc&quot;&gt;\n   &lt;div class=&quot;top&quot;&gt;&lt;b&gt;${svg('bird',16,1.9)} Bird forecast&lt;/b&gt;&lt;span class=&quot;lvl&quot; style=&quot;margin-left:auto;color:var(--ok)&quot;&gt;${svg('arrowup',15,2.2)} Activity high&lt;/span&gt;&lt;/div&gt;\n   &lt;p class=&quot;likely&quot;&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:12px&quot;&gt;Likely now (9 AM): &lt;/span&gt;&lt;a onclick=&quot;openBird('House Finch','Haemorhous mexicanus')&quot;&gt;House Finch&lt;/a&gt;, &lt;a onclick=&quot;openBird('Lesser Goldfinch','Spinus psaltria')&quot;&gt;Lesser Goldfinch&lt;/a&gt;, &lt;a onclick=&quot;openBird('Chestnut-backed Chickadee','Poecile rufescens')&quot;&gt;Chickadee&lt;/a&gt;&lt;/p&gt;\n   &lt;p class=&quot;why&quot;&gt;~12 species expected today; strong dawn movement after overnight rain. Tap through for the week.&lt;/p&gt;&lt;/div&gt;`}\nfunction sprow(s,status,showAct){\n const badge=status==='suggested'&amp;&amp;s[4]?`&lt;span class=&quot;pill new&quot;&gt;${svg('spark',10,2)}New&lt;/span&gt;`:status==='confirmed'?`&lt;span class=&quot;pill ok&quot;&gt;${svg('check',11,2.4)}&lt;/span&gt;`:'';\n return `&lt;div class=&quot;sprow&quot; onclick=&quot;openBird('${s[0].replace(/'/g,&quot;\\\\'&quot;)}','${s[1]}')&quot;&gt;${thumb(s[1])}\n   &lt;span class=&quot;nm&quot;&gt;&lt;b&gt;${s[0]} ${badge}&lt;/b&gt;&lt;i&gt;${s[1]}&lt;/i&gt;&lt;/span&gt;\n   &lt;span class=&quot;ct&quot;&gt;&lt;b&gt;${s[2].toLocaleString()}×&lt;/b&gt;best ${Math.round(s[3]*100)}%&lt;/span&gt;\n   ${showAct&amp;&amp;status==='suggested'?`&lt;button class=&quot;act&quot; onclick=&quot;event.stopPropagation();confirmSp(this)&quot; title=&quot;Confirm&quot;&gt;${svg('check',16,2.2)}&lt;/button&gt;`:''}&lt;/div&gt;`;\n}\nfunction stat(n,l){return `&lt;div class=&quot;card stat&quot;&gt;&lt;div class=&quot;n&quot;&gt;${n}&lt;/div&gt;&lt;div class=&quot;l&quot;&gt;${l}&lt;/div&gt;&lt;/div&gt;`}\n\n/* ===================================================================== BIRDS */\nfunction Birds(){\n const p=PLACES[cur], S=SPECIES[cur], list=S[sprFilter]||[];\n const counts={confirmed:p.confirmed,suggested:p.suggested,rejected:p.rejected};\n return `&lt;div class=&quot;pagewrap&quot;&gt;\n   &lt;div class=&quot;card&quot; style=&quot;display:flex;align-items:center;gap:8px;padding:0 11px;height:40px;margin:8px 0 12px&quot;&gt;&lt;span class=&quot;muted&quot;&gt;${svg('search',16,2)}&lt;/span&gt;&lt;input placeholder=&quot;Search ${p.species} species at ${p.name}…&quot; style=&quot;flex:1;border:none;background:none;outline:none;font-size:13px;color:var(--fg)&quot;/&gt;&lt;/div&gt;\n   &lt;div class=&quot;seg full&quot;&gt;${[['confirmed','Confirmed'],['suggested','Suggested'],['rejected','Rejected']].map(([k,l])=&gt;`&lt;button class=&quot;${sprFilter===k?'on':''}&quot; onclick=&quot;setFilter('${k}')&quot;&gt;${l}&lt;span class=&quot;ct&quot;&gt;${counts[k]}&lt;/span&gt;&lt;/button&gt;`).join('')}&lt;/div&gt;\n   ${sprFilter==='suggested'?`&lt;p class=&quot;muted&quot; style=&quot;font-size:11.5px;padding:8px 4px 2px&quot;&gt;New arrivals to review — confirm to add, or reject to stop suggesting.&lt;/p&gt;`:''}\n   ${sprFilter==='rejected'?`&lt;p class=&quot;muted&quot; style=&quot;font-size:11.5px;padding:8px 4px 2px&quot;&gt;Hidden from counts, activity &amp; forecast. Nothing is deleted — restore any time.&lt;/p&gt;`:''}\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 13px;margin-top:10px&quot;&gt;&lt;div class=&quot;splist web2&quot;&gt;${list.length?list.map(s=&gt;sprow(s,sprFilter,true)).join(''):`&lt;p class=&quot;muted&quot; style=&quot;padding:18px 0;text-align:center;font-size:13px&quot;&gt;Nothing ${sprFilter} here.&lt;/p&gt;`}&lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;The status filter lives here, at the top&lt;/b&gt; — counts match the list. Home stays purely confirmed, so nothing above the activity chart silently changes under you.&lt;/div&gt;\n &lt;/div&gt;`;\n}\n\n/* ===================================================================== BIRD DETAIL */\nfunction openBird(name,sci){birdName=name;birdSci=sci;detFilter='all';openDet=-1;tab='bird';render()}\nfunction BirdDetail(){\n const c=catFor(birdSci), list=DET.filter(d=&gt;detFilter==='all'||d.st===detFilter);\n const left=`&lt;div class=&quot;card&quot; style=&quot;overflow:hidden&quot;&gt;\n   &lt;div class=&quot;bdphoto&quot; style=&quot;background:linear-gradient(135deg,color-mix(in srgb,${c} 24%,transparent),color-mix(in srgb,var(--cat-blue) 14%,transparent))&quot;&gt;${svg('bird',60,1.3)}&lt;span class=&quot;ph mono&quot;&gt;photo · ${birdName}&lt;/span&gt;&lt;/div&gt;\n   &lt;div style=&quot;padding:14px&quot;&gt;\n     &lt;h2 style=&quot;margin:0;font-size:21px;letter-spacing:-.02em&quot;&gt;${birdName}&lt;/h2&gt;\n     &lt;div class=&quot;muted&quot; style=&quot;font-style:italic;font-size:12.5px;margin-top:2px&quot;&gt;${birdSci}&lt;/div&gt;\n     &lt;p style=&quot;font-size:13px;line-height:1.5;margin:10px 0 8px&quot;&gt;A small, social finch — males washed rosy-red on the head and breast. Year-round resident and the most-heard bird at the Yard.&lt;/p&gt;\n     &lt;a class=&quot;muted&quot; style=&quot;font-size:11.5px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;cursor:pointer&quot;&gt;Wikipedia ${svg('ext',11,2)}&lt;/a&gt;\n   &lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;stats&quot; style=&quot;margin-top:12px&quot;&gt;${stat('1,842','Detections')}${stat('9','Days heard')}${stat('94%','Best')}${stat('88%','Local')}&lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('mic',14,2)} Recordings&lt;span class=&quot;nt&quot;&gt;3 clips saved&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:13px&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;seg&quot;&gt;&lt;button class=&quot;on&quot;&gt;Default&lt;/button&gt;&lt;button&gt;Always&lt;/button&gt;&lt;button&gt;Never&lt;/button&gt;&lt;/span&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11px;margin-left:auto&quot;&gt;save audio&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;\n const right=`${activityChart({h:130,noDiv:true})}\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('list',14,2)} Detections&lt;span class=&quot;nt&quot;&gt;${list.length} shown · scoped by toolbar&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;seg full&quot; style=&quot;margin-bottom:8px&quot;&gt;${[['all','All'],['confirmed','Confirmed'],['suggested','Suggested'],['rejected','Rejected']].map(([k,l])=&gt;`&lt;button class=&quot;${detFilter===k?'on':''}&quot; onclick=&quot;setDet('${k}')&quot;&gt;${l}&lt;/button&gt;`).join('')}&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 13px&quot;&gt;${list.length?list.map((d,i)=&gt;detItem(d,DET.indexOf(d))).join(''):`&lt;p class=&quot;muted&quot; style=&quot;padding:16px 0;text-align:center;font-size:13px&quot;&gt;No ${detFilter} detections.&lt;/p&gt;`}&lt;/div&gt;`;\n return `&lt;div class=&quot;backrow&quot; onclick=&quot;go(backTab==='bird'?'birds':backTab)&quot;&gt;&lt;span&gt;${svg('chevL',16,2.2)}&lt;/span&gt; Back&lt;/div&gt;\n   &lt;div class=&quot;bd-grid&quot;&gt;&lt;div&gt;${left}&lt;/div&gt;&lt;div&gt;${right}&lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;One bird, every angle.&lt;/b&gt; It uses the &lt;b&gt;same toolbar Location · Device · Time filters&lt;/b&gt; as the rest of the app — no page-specific pickers. Activity is confirmed (the species' settled record); the detection rows below are where you re-classify single events. Rows collapse to the essentials and expand for the status toggle + where it was heard.&lt;/div&gt;`;\n}\nfunction detItem(d,idx){\n const open=openDet===idx;\n const stColor={confirmed:'var(--ok-solid)',suggested:'var(--accent)',rejected:'var(--danger-solid)'}[d.st];\n const head=`&lt;div class=&quot;det-row&quot; onclick=&quot;toggleDet(${idx})&quot;&gt;\n   &lt;span class=&quot;when&quot;&gt;${d.when}&lt;/span&gt;\n   &lt;span class=&quot;midd&quot;&gt;&lt;span class=&quot;st&quot; style=&quot;background:${stColor}&quot; title=&quot;${d.st}&quot;&gt;&lt;/span&gt;&lt;span class=&quot;cf muted&quot;&gt;${Math.round(d.cf*100)}%&lt;/span&gt;&lt;/span&gt;\n   ${d.rec?`&lt;button class=&quot;playb&quot; onclick=&quot;event.stopPropagation()&quot; title=&quot;Play&quot;&gt;${svg('play',13,0)}&lt;/button&gt;`:''}\n   &lt;span class=&quot;cev&quot;&gt;${svg('chevD',16,2)}&lt;/span&gt;&lt;/div&gt;`;\n const exp=open?`&lt;div class=&quot;det-exp&quot;&gt;\n   &lt;div class=&quot;chips&quot;&gt;&lt;span class=&quot;chip&quot;&gt;${svg('pin',11,2)} ${d.loc}&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;${svg('phone',11,2)} ${DEVICES[d.dev].name}&lt;/span&gt;&lt;span class=&quot;chip&quot;&gt;${svg('volume',11,2)} ${Math.round(d.cf*100)}% confidence&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;triset&quot;&gt;\n     &lt;button class=&quot;tri ok ${d.st==='confirmed'?'on':''}&quot; onclick=&quot;setDetStatus(${idx},'confirmed')&quot;&gt;${svg('check',14,2.2)} Confirmed&lt;/button&gt;\n     &lt;button class=&quot;tri sug ${d.st==='suggested'?'on':''}&quot; onclick=&quot;setDetStatus(${idx},'suggested')&quot;&gt;${svg('dash',14,1.8)} Suggested&lt;/button&gt;\n     &lt;button class=&quot;tri rej ${d.st==='rejected'?'on':''}&quot; onclick=&quot;setDetStatus(${idx},'rejected')&quot;&gt;${svg('ban',14,1.8)} Rejected&lt;/button&gt;\n   &lt;/div&gt;&lt;/div&gt;`:'';\n return `&lt;div class=&quot;det ${open?'open':''}&quot;&gt;${head}${exp}&lt;/div&gt;`;\n}\n\n/* ===================================================================== FORECAST */\nlet fcDay=0;\nfunction Forecast(){\n const day=WEEK[fcDay];\n return `&lt;div class=&quot;pagewrap wide&quot;&gt;\n   &lt;div class=&quot;seclabel&quot; style=&quot;margin-top:8px&quot;&gt;${svg('bird',14,2)} Expected this week&lt;span class=&quot;nt&quot;&gt;${PLACES[cur].name} · from history × conditions&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;card lchart&quot;&gt;\n     &lt;div class=&quot;lhd&quot;&gt;&lt;span class=&quot;lt&quot;&gt;${svg('bird',16,2)} Expected this week&lt;/span&gt;\n       &lt;div class=&quot;legrow&quot;&gt;\n         &lt;span class=&quot;legtog on&quot; style=&quot;cursor:default&quot;&gt;&lt;span class=&quot;linec&quot; style=&quot;border-color:var(--cat-blue);border-top-width:7px;border-radius:2px&quot;&gt;&lt;/span&gt;Detections&lt;/span&gt;\n         ${legtog(fcSpecies,'var(--cat-orchid)',false,'Species','/day',&quot;fcToggle('sp')&quot;)}\n         ${legtog(fcWxWeek,'var(--cat-slate)',true,'Weather','high °F',&quot;fcToggle('wxw')&quot;)}\n       &lt;/div&gt;&lt;/div&gt;\n     ${chart({bars:WEEK.map(d=&gt;({v:d.det,label:d.d.slice(0,3),peak:d.lv==='high'})), height:162, onBar:'setFcDay($I)',\n       rainTrack:WEEK.map(d=&gt;d.rain),\n       lines: fcSpecies?[{vals:WEEK.map(d=&gt;d.sp),color:'var(--cat-orchid)',axis:'auto'}]:[],\n       rightAxis: fcWxWeek?{vals:WEEK.map(d=&gt;d.hi),fmt:v=&gt;v+'°'}:null,\n       tip:(i,b)=&gt;`${WEEK[i].d} · &lt;b&gt;${b.v}&lt;/b&gt; dets · ~${WEEK[i].sp} species · ${WEEK[i].hi}°/${WEEK[i].lo}° · ${WEEK[i].rain}% rain — tap`})}\n     &lt;p class=&quot;muted&quot; style=&quot;font-size:10.5px;margin:9px 0 0&quot;&gt;Bars = expected detections (peak days violet); orchid line = expected &lt;b style=&quot;color:var(--fg)&quot;&gt;species&lt;/b&gt; (own scale). The blue lane tracks rain chance. Toggle layers; tap a day for detail.&lt;/p&gt;\n   &lt;/div&gt;\n   &lt;div style=&quot;display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px&quot;&gt;\n     ${WEEK.map((d,i)=&gt;`&lt;button class=&quot;card daycard&quot; style=&quot;${i===fcDay?'border-color:var(--accent)':''}&quot; onclick=&quot;setFcDay(${i})&quot;&gt;\n       &lt;b&gt;${d.d}&lt;/b&gt;&lt;div class=&quot;lv&quot; style=&quot;color:${lvTone(d.lv)}&quot;&gt;${d.lv}&lt;/div&gt;\n       &lt;div style=&quot;font-size:12px;margin-top:2px;font-weight:600&quot;&gt;~${d.sp} species&lt;/div&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:10.5px;margin-top:5px&quot;&gt;${d.t}&lt;/div&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:10px;margin-top:2px;display:inline-flex;align-items:center;gap:3px&quot;&gt;${svg('drop',10,2)} ${d.rain}%&lt;/div&gt;&lt;/button&gt;`).join('')}\n   &lt;/div&gt;\n   &lt;div class=&quot;two cols2&quot; style=&quot;margin-top:6px&quot;&gt;\n     &lt;div class=&quot;card lchart&quot;&gt;\n       &lt;div class=&quot;lhd&quot;&gt;&lt;span class=&quot;lt&quot;&gt;${day.d==='Today'?'Today':day.d}'s shape&lt;/span&gt;\n         &lt;div class=&quot;legrow&quot;&gt;\n           ${legtog(fcDiv,'var(--cat-orchid)',false,'Diversity','species/hr',&quot;fcToggle('div')&quot;)}\n           ${legtog(fcWxDay,'var(--cat-slate)',true,'Weather','°F',&quot;fcToggle('wxd')&quot;)}\n         &lt;/div&gt;&lt;/div&gt;\n       ${chart({bars:ACTIVITY.map((v,h)=&gt;({v:Math.round(v*day.det/320),label:hh(h)})), height:166, xinterval:6,\n         area:{vals:ACTIVITY.map(v=&gt;Math.round(v*day.det/320)),color:'var(--cat-blue)'}, daylight:{sr:6,ss:20},\n         lines: fcDiv?[{vals:DIVERSITY,color:'var(--cat-orchid)',axis:'auto'}]:[],\n         rightAxis: fcWxDay?{vals:TEMP,fmt:v=&gt;v+'°'}:null,\n         rainTrack: ACTIVITY.map((_,h)=&gt;Math.round(day.rain*Math.max(0,1-Math.abs(h-13)/7))),\n         markers:[{x:6,ic:'sunrise'},{x:20,ic:'sunset'}],\n         tip:(i,b)=&gt;`${hh(i)} · &lt;b&gt;${b.v}&lt;/b&gt; det${b.v===1?'':'s'}${fcDiv?` · ${DIVERSITY[i]} spp`:''}${fcWxDay?` · ${TEMP[i]}°F`:''}`})}\n       &lt;p style=&quot;font-size:12.5px;margin:9px 0 0&quot;&gt;Expect &lt;b&gt;~${day.sp} species&lt;/b&gt; across &lt;b&gt;${day.det}&lt;/b&gt; detections, busiest &lt;b&gt;6 AM&lt;/b&gt; &amp; &lt;b&gt;6 PM&lt;/b&gt;.&lt;/p&gt;\n       &lt;p class=&quot;why&quot; style=&quot;color:var(--muted);font-size:11.5px;margin:6px 0 0&quot;&gt;${day.lv==='high'?'Rising pressure, calm and clear — a strong movement day.':day.lv==='low'?'Rain and wind suppress activity; expect a quiet day.':'Mixed conditions; a typical day for the season.'}&lt;/p&gt;\n     &lt;/div&gt;\n     &lt;div class=&quot;card&quot; style=&quot;padding:13px&quot;&gt;\n       &lt;div class=&quot;seclabel&quot; style=&quot;margin:0 0 8px&quot;&gt;${svg('sun',14,2)} Conditions&lt;/div&gt;\n       ${tempSpark(day)}\n       &lt;div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:11px 8px;margin-top:12px&quot;&gt;\n         ${fact('sunrise','Sunrise','5:48 AM')}${fact('sunset','Sunset','8:31 PM')}\n         ${fact('moon','Moon','38% waxing')}${fact('drop','Rain chance',day.rain+'%')}\n         ${fact('wind','Peak wind','11 mph')}${fact('gauge','Pressure','1018 hPa ↑')}\n       &lt;/div&gt;\n       &lt;div class=&quot;seclabel&quot; style=&quot;margin:16px 0 6px&quot;&gt;${svg('bird',14,2)} Usual regulars&lt;/div&gt;\n       &lt;p style=&quot;font-size:12.5px;line-height:1.6;margin:0&quot;&gt;${SPECIES.yard.confirmed.slice(0,5).map(s=&gt;`&lt;a onclick=&quot;openBird('${s[0].replace(/'/g,&quot;\\\\'&quot;)}','${s[1]}')&quot; style=&quot;color:var(--accent);text-decoration:none;font-weight:600&quot;&gt;${s[0]}&lt;/a&gt;`).join(', ')}&lt;/p&gt;\n     &lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Forecast keeps its layers.&lt;/b&gt; Species leads (not raw detections); the week graph carries a species line over detection bars, and each day expands to an hourly activity + diversity chart with dawn/dusk markers, plus the weather/light context underneath. Toggle layers to keep the chart readable. &lt;span class=&quot;ph-flag&quot;&gt;${svg('spark',10,2)} copy is placeholder&lt;/span&gt; — the real model already produces this data.&lt;/div&gt;\n &lt;/div&gt;`;\n}\nfunction tempSpark(day){\n const lo=Math.min(...TEMP),hi=Math.max(...TEMP),span=hi-lo||1;\n const pp=TEMP.map((t,h)=&gt;[(h/23)*100, 4+(1-(t-lo)/span)*88]);\n const d=smooth(pp);\n return `&lt;div&gt;&lt;svg viewBox=&quot;0 0 100 100&quot; preserveAspectRatio=&quot;none&quot; style=&quot;width:100%;height:50px;display:block&quot;&gt;\n   &lt;defs&gt;&lt;linearGradient id=&quot;tsg&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;&gt;&lt;stop offset=&quot;0&quot; stop-color=&quot;var(--cat-slate)&quot; stop-opacity=&quot;.26&quot;/&gt;&lt;stop offset=&quot;1&quot; stop-color=&quot;var(--cat-slate)&quot; stop-opacity=&quot;0&quot;/&gt;&lt;/linearGradient&gt;&lt;/defs&gt;\n   &lt;path d=&quot;${d} L100,100 L0,100 Z&quot; fill=&quot;url(#tsg)&quot;/&gt;\n   &lt;path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;var(--cat-slate)&quot; stroke-width=&quot;1.8&quot; vector-effect=&quot;non-scaling-stroke&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;\n   &lt;div style=&quot;display:flex;justify-content:space-between;font-size:10px;color:var(--faint);font-family:var(--font-mono);margin-top:4px&quot;&gt;&lt;span&gt;12 AM&lt;/span&gt;&lt;span style=&quot;color:var(--muted)&quot;&gt;${lo}°F low · ${hi}°F high${day.rain&gt;=20?' · rain midday':''}&lt;/span&gt;&lt;span&gt;11 PM&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;\n}\nfunction fact(ic,l,v){return `&lt;div style=&quot;display:flex;align-items:center;gap:8px&quot;&gt;&lt;span class=&quot;muted&quot;&gt;${svg(ic,17,2)}&lt;/span&gt;&lt;span&gt;&lt;b style=&quot;display:block;font-size:13px;font-weight:600&quot;&gt;${v}&lt;/b&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:10.5px&quot;&gt;${l}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`}\n\n/* ===================================================================== ATLAS */\nfunction Atlas(){\n let dots='';for(let i=0;i&lt;170;i++){const cl=atlasScope==='species'?CLUSTERS[i%4]:null; const col=atlasScope==='species'?cl[1]:CAT[i%6]; const dim=atlasScope==='species'&amp;&amp;atlasCluster!=null&amp;&amp;(i%4)!==atlasCluster; dots+=`&lt;span class=&quot;dot&quot; style=&quot;left:${8+(hash('x'+i)%84)}%;top:${8+(hash('y'+i)%84)}%;background:${col};opacity:${dim?0.12:0.82}&quot;&gt;&lt;/span&gt;`}\n const map=`&lt;div class=&quot;card&quot; style=&quot;padding:8px&quot;&gt;\n   &lt;div class=&quot;atlasmap&quot;&gt;${dots}\n     &lt;div class=&quot;atlas-zoom&quot;&gt;&lt;button class=&quot;azb&quot;&gt;${svg('zin',15,2)}&lt;/button&gt;&lt;button class=&quot;azb&quot;&gt;${svg('zout',15,2)}&lt;/button&gt;&lt;button class=&quot;azb&quot;&gt;${svg('fit',15,2)}&lt;/button&gt;&lt;/div&gt;\n   &lt;/div&gt;&lt;/div&gt;`;\n const side = atlasScope==='overview'?overviewSide():clusterSide();\n return `&lt;div class=&quot;pagewrap wide&quot;&gt;\n   &lt;div style=&quot;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin:8px 0 4px&quot;&gt;\n     &lt;div class=&quot;seg&quot;&gt;&lt;button class=&quot;${atlasScope==='overview'?'on':''}&quot; onclick=&quot;setAtlas('overview')&quot;&gt;Overview&lt;/button&gt;&lt;button class=&quot;${atlasScope==='species'?'on':''}&quot; onclick=&quot;setAtlas('species')&quot;&gt;By species&lt;/button&gt;&lt;/div&gt;\n     &lt;span class=&quot;muted&quot; style=&quot;font-size:11.5px&quot;&gt;${atlasScope==='overview'?'Each point = one call, coloured by species':'House Finch · '+CLUSTERS.length+' call groups'}&lt;/span&gt;\n     &lt;span class=&quot;muted&quot; style=&quot;font-size:11px;margin-left:auto;display:inline-flex;align-items:center;gap:5px&quot;&gt;${svg('atlas',13,2)} 5,210 calls · updated 2h ago&lt;/span&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;atlas-grid&quot;&gt;${map}&lt;div&gt;${side}&lt;/div&gt;&lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Soundscape Atlas, fleshed out.&lt;/b&gt; The map is every detection embedded by sound (BirdNET → UMAP). &lt;b&gt;Overview&lt;/b&gt; colours the yard by species — a new blob is a new sound. &lt;b&gt;By species&lt;/b&gt; splits one bird's calls into groups you label once (song / contact / alarm…); new calls then auto-tag by nearest group. Tap a point to hear it; tap a group to listen and name it. &lt;span class=&quot;ph-flag&quot;&gt;${svg('spark',10,2)} placeholder map&lt;/span&gt; — real one is an interactive UMAP scatter.&lt;/div&gt;\n &lt;/div&gt;`;\n}\nfunction overviewSide(){\n const counts=SPECIES.yard.confirmed.slice(0,8);\n return `&lt;div class=&quot;card&quot; style=&quot;padding:13px&quot;&gt;&lt;div class=&quot;seclabel&quot; style=&quot;margin:0 0 8px&quot;&gt;${svg('atlas',14,2)} Species&lt;/div&gt;\n   &lt;p class=&quot;muted&quot; style=&quot;font-size:11.5px;margin:0 0 8px&quot;&gt;Pick a species to explore its call groups.&lt;/p&gt;\n   ${counts.map(s=&gt;`&lt;div class=&quot;legend-row&quot; onclick=&quot;setAtlas('species')&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${catFor(s[1])}&quot;&gt;&lt;/span&gt;&lt;span style=&quot;flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap&quot;&gt;${s[0]}&lt;/span&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;${s[2]}&lt;/span&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;`;\n}\nfunction clusterSide(){\n return `&lt;div class=&quot;card&quot; style=&quot;padding:13px&quot;&gt;&lt;div class=&quot;seclabel&quot; style=&quot;margin:0 0 8px&quot;&gt;${svg('pin2',14,2)} Call groups&lt;/div&gt;\n   &lt;p class=&quot;muted&quot; style=&quot;font-size:11.5px;margin:0 0 8px&quot;&gt;Calls that sound alike are grouped. Open one to listen, then name it — new calls join the nearest group automatically.&lt;/p&gt;\n   ${CLUSTERS.map((c,i)=&gt;{const open=atlasCluster===i; return `&lt;div&gt;\n     &lt;div class=&quot;cluster&quot; onclick=&quot;setCluster(${i})&quot;&gt;&lt;span class=&quot;sw&quot; style=&quot;background:${c[1]}&quot;&gt;&lt;/span&gt;&lt;b style=&quot;flex:1;font-size:13.5px;font-weight:600&quot;&gt;${c[3]?c[0]:'Group '+(i+1)}&lt;/b&gt;${c[3]?'':'&lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;unnamed&lt;/span&gt;'}&lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;${c[2]} calls&lt;/span&gt;${svg(open?'chevD':'chevR',15,2)}&lt;/div&gt;\n     ${open?`&lt;div style=&quot;padding:2px 2px 12px&quot;&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:11px;display:inline-flex;align-items:center;gap:5px;margin-bottom:7px&quot;&gt;${svg('volume',12,2)} Listen to a few&lt;/div&gt;\n       &lt;div style=&quot;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px&quot;&gt;${Array.from({length:5}).map(()=&gt;`&lt;button class=&quot;playb&quot;&gt;${svg('play',12,0)}&lt;/button&gt;`).join('')}&lt;/div&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:11px;margin-bottom:5px&quot;&gt;${c[3]?'Call type':'Recognise it? Name it'}&lt;/div&gt;\n       &lt;div class=&quot;atlas-chips&quot;&gt;${['Song','Contact','Alarm','Flight','Begging','Other'].map(t=&gt;`&lt;button class=&quot;atlas-chip ${c[3]&amp;&amp;c[0].startsWith(t)?'on':''}&quot;&gt;${t}&lt;/button&gt;`).join('')}&lt;/div&gt;\n     &lt;/div&gt;`:''}&lt;/div&gt;`}).join('')}&lt;/div&gt;`;\n}\n\n/* ===================================================================== RECORDINGS */\nfunction Recordings(){\n const clips=[['House Finch','Haemorhous mexicanus','Today · 9:41 AM',0.86,'420 KB',true],['Chestnut-backed Chickadee','Poecile rufescens','Today · 9:28 AM',0.9,'388 KB',false],['American Robin','Turdus migratorius','Today · 8:44 AM',0.91,'455 KB',false],['Dark-eyed Junco','Junco hyemalis','Yesterday · 7:02 AM',0.85,'401 KB',true],['Pygmy Nuthatch','Sitta pygmaea','Jun 14 · 6:40 AM',0.72,'376 KB',false]];\n return `&lt;div class=&quot;pagewrap&quot;&gt;&lt;div class=&quot;backrow&quot; onclick=&quot;go('more')&quot;&gt;&lt;span&gt;${svg('chevL',16,2.2)}&lt;/span&gt; More&lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot; style=&quot;margin-top:2px&quot;&gt;${svg('audio',14,2)} Storage&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:14px&quot;&gt;\n     &lt;div style=&quot;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px&quot;&gt;&lt;b style=&quot;font-size:14px&quot;&gt;1.2 GB of 4 GB&lt;/b&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11.5px&quot;&gt;312 clips&lt;/span&gt;&lt;/div&gt;\n     &lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:30%;background:var(--accent);opacity:.85&quot;&gt;&lt;/i&gt;&lt;i style=&quot;width:11%;background:var(--accent);opacity:.5&quot;&gt;&lt;/i&gt;&lt;/div&gt;\n     &lt;div class=&quot;muted&quot; style=&quot;font-size:11px;margin-top:7px&quot;&gt;Protected (pinned / “always”): 0.4 GB · When full: remove oldest recordings&lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('sliders',14,2)} Storage settings&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:14px;display:grid;gap:14px&quot;&gt;\n     &lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Total storage limit&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;&lt;button class=&quot;btn sm&quot;&gt;–&lt;/button&gt;&lt;b style=&quot;font-variant-numeric:tabular-nums&quot;&gt;4000 MB&lt;/b&gt;&lt;button class=&quot;btn sm&quot;&gt;+&lt;/button&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11px;margin-left:6px&quot;&gt;≈ 9,400 clips&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;\n     &lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;When full&lt;/div&gt;&lt;span class=&quot;seg full&quot;&gt;&lt;button class=&quot;on&quot;&gt;Remove oldest&lt;/button&gt;&lt;button&gt;Stop saving&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('mic',14,2)} Saved clips&lt;span class=&quot;nt&quot;&gt;${clips.length} of 312&lt;/span&gt;&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 13px&quot;&gt;${clips.map(c=&gt;`&lt;div class=&quot;prow&quot; style=&quot;cursor:default&quot; onclick=&quot;openBird('${c[0].replace(/'/g,&quot;\\\\'&quot;)}','${c[1]}')&quot;&gt;\n     &lt;button class=&quot;playb&quot; onclick=&quot;event.stopPropagation()&quot;&gt;${svg('play',13,0)}&lt;/button&gt;\n     ${thumb(c[1],36)}\n     &lt;span class=&quot;nm&quot;&gt;&lt;b&gt;${c[0]}&lt;/b&gt;&lt;div class=&quot;pmeta&quot;&gt;&lt;span class=&quot;pwin mono&quot;&gt;${c[2]}&lt;/span&gt;&lt;/div&gt;&lt;/span&gt;\n     &lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;${c[4]}&lt;/span&gt;\n     &lt;span class=&quot;pill neutral&quot;&gt;${Math.round(c[3]*100)}%&lt;/span&gt;\n     &lt;button class=&quot;miniact&quot; style=&quot;color:${c[5]?'var(--accent)':'var(--muted)'}&quot; onclick=&quot;event.stopPropagation()&quot; title=&quot;${c[5]?'Pinned':'Pin'}&quot;&gt;${svg('pin2',14,2)}&lt;/button&gt;\n     &lt;button class=&quot;miniact&quot; onclick=&quot;event.stopPropagation()&quot; title=&quot;Delete&quot;&gt;${svg('trash',14,2)}&lt;/button&gt;&lt;/div&gt;`).join('')}&lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;Recordings management — storage meter, budget, and per-clip pin/delete. Audio always analyses; this controls what's &lt;b&gt;kept&lt;/b&gt;. Per-bird “Always/Never” lives on each bird's page.&lt;/div&gt;\n &lt;/div&gt;`;\n}\n\n/* ===================================================================== SETTINGS */\nlet setNonBird=false, setSave=true, setAtlasSave=true, setMinConf=0.5, setRange='balanced', setNew=2;\nfunction Settings(){\n return `&lt;div class=&quot;pagewrap&quot;&gt;&lt;div class=&quot;backrow&quot; onclick=&quot;go('more')&quot;&gt;&lt;span&gt;${svg('chevL',16,2.2)}&lt;/span&gt; More&lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot; style=&quot;margin-top:2px&quot;&gt;${svg('user',14,2)} Account&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:14px&quot;&gt;&lt;div class=&quot;row&quot;&gt;&lt;span class=&quot;thumb&quot; style=&quot;width:38px;height:38px;background:var(--accent-soft);color:var(--accent)&quot;&gt;${svg('user',18,2)}&lt;/span&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;b style=&quot;font-size:14px&quot;&gt;Ben Miriello&lt;/b&gt;&lt;span class=&quot;muted&quot; style=&quot;display:block;font-size:11.5px&quot;&gt;ben@benmiriello.com&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;btn sm&quot;&gt;Sign out&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;\n\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('target',14,2)} Detection accuracy&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:14px;display:grid;gap:16px&quot;&gt;\n     &lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between&quot;&gt;&lt;span class=&quot;lbl&quot; style=&quot;margin:0&quot;&gt;Minimum confidence&lt;/span&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:12px&quot;&gt;${Math.round(setMinConf*100)}%&lt;/span&gt;&lt;/div&gt;\n       &lt;div class=&quot;rangewrap&quot;&gt;&lt;input type=&quot;range&quot; min=&quot;10&quot; max=&quot;95&quot; value=&quot;${setMinConf*100}&quot; oninput=&quot;setRangeVal('conf',this.value)&quot;/&gt;&lt;/div&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;How sure the model must be before a sound counts. 50–70% suits a phone mic.&lt;/div&gt;&lt;/div&gt;\n     &lt;div&gt;&lt;div class=&quot;lbl&quot;&gt;Location filter&lt;/div&gt;\n       &lt;span class=&quot;seg full&quot;&gt;${['lenient','balanced','strict'].map(k=&gt;`&lt;button class=&quot;${setRange===k?'on':''}&quot; onclick=&quot;setRangeKey('${k}')&quot; style=&quot;text-transform:capitalize&quot;&gt;${k}&lt;/button&gt;`).join('')}&lt;/span&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:11px;margin-top:6px&quot;&gt;${setRange==='lenient'?'Allows rare-but-possible local visitors.':setRange==='strict'?'Only species clearly expected here right now.':'Ignores species unlikely at your location this season. Recommended.'}&lt;/div&gt;&lt;/div&gt;\n     &lt;div&gt;&lt;div style=&quot;display:flex;justify-content:space-between&quot;&gt;&lt;span class=&quot;lbl&quot; style=&quot;margin:0&quot;&gt;New-species confirmations&lt;/span&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:12px&quot;&gt;${setNew}×&lt;/span&gt;&lt;/div&gt;\n       &lt;div class=&quot;rangewrap&quot;&gt;&lt;input type=&quot;range&quot; min=&quot;1&quot; max=&quot;6&quot; value=&quot;${setNew}&quot; oninput=&quot;setRangeVal('new',this.value)&quot;/&gt;&lt;/div&gt;\n       &lt;div class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;A never-before-heard species must be detected this many times in a row before it's recorded.&lt;/div&gt;&lt;/div&gt;\n     &lt;div class=&quot;row&quot; style=&quot;padding-top:4px;border-top:1px solid var(--border)&quot;&gt;&lt;button class=&quot;btn&quot;&gt;${svg('refresh',14,2)} Re-apply to past detections&lt;/button&gt;&lt;span class=&quot;muted&quot; style=&quot;font-size:11px&quot;&gt;Hide now-impossible species. Nothing deleted.&lt;/span&gt;&lt;/div&gt;\n   &lt;/div&gt;\n\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('mic',14,2)} Recordings &amp; Atlas&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 14px&quot;&gt;\n     ${setRowToggle('Save recordings of detections', setSave?'Every detection\\'s clip is saved by default.':'Clips are not saved by default.', setSave, &quot;save&quot;)}\n     ${setRowToggle('Save Atlas exemplar clips', 'Keeps a few clips per acoustic cluster so you can label call types by ear.', setAtlasSave, &quot;atlas&quot;)}\n     &lt;div class=&quot;set-row&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;b style=&quot;font-size:13.5px&quot;&gt;Rebuild the Atlas map&lt;/b&gt;&lt;span class=&quot;muted&quot; style=&quot;display:block;font-size:11.5px;margin-top:2px&quot;&gt;Rebuilds nightly; use for an on-demand refresh.&lt;/span&gt;&lt;/span&gt;&lt;button class=&quot;btn sm&quot;&gt;${svg('refresh',13,2)} Rebuild&lt;/button&gt;&lt;/div&gt;\n   &lt;/div&gt;\n\n   &lt;div class=&quot;seclabel&quot;&gt;${svg('list',14,2)} Display&lt;/div&gt;\n   &lt;div class=&quot;card&quot; style=&quot;padding:4px 14px&quot;&gt;\n     ${setRowToggle('Show non-bird detections', setNonBird?'Non-bird classes (engine, dog, frog…) show alongside birds, tagged.':'Only birds are shown. Non-bird classes are still detected &amp; stored.', setNonBird, &quot;nb&quot;)}\n   &lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;Full settings surface — account, detection accuracy (the knobs that stop impossible birds), recording &amp; Atlas budgets, and the non-bird display filter. Config writes save explicitly; view prefs commit on change.&lt;/div&gt;\n &lt;/div&gt;`;\n}\nfunction setRowToggle(title,desc,on,key){return `&lt;div class=&quot;set-row&quot;&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;b style=&quot;font-size:13.5px&quot;&gt;${title}&lt;/b&gt;&lt;span class=&quot;muted&quot; style=&quot;display:block;font-size:11.5px;margin-top:2px&quot;&gt;${desc}&lt;/span&gt;&lt;/span&gt;&lt;div class=&quot;toggle ${on?'on':''}&quot; onclick=&quot;toggleSet('${key}')&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;`}\n\n/* ===================================================================== MORE / LOCATIONS / DEVICES */\nfunction More(){\n return `&lt;div class=&quot;pagewrap&quot;&gt;&lt;div class=&quot;seclabel&quot; style=&quot;margin-top:8px&quot;&gt;Places &amp; devices&lt;/div&gt;\n   &lt;div class=&quot;card hub&quot;&gt;\n     &lt;div class=&quot;hubitem&quot; onclick=&quot;go('locations')&quot;&gt;&lt;span class=&quot;hg&quot;&gt;${svg('pin',20,1.9)}&lt;/span&gt;&lt;span class=&quot;ht&quot;&gt;&lt;b&gt;Locations&lt;/b&gt;&lt;span&gt;3 places · Yard is home&lt;/span&gt;&lt;/span&gt;${svg('chevR',16,2)}&lt;/div&gt;\n     &lt;div class=&quot;hubitem&quot; onclick=&quot;go('devices')&quot;&gt;&lt;span class=&quot;hg&quot;&gt;${svg('phone',20,1.9)}&lt;/span&gt;&lt;span class=&quot;ht&quot;&gt;&lt;b&gt;Devices&lt;/b&gt;&lt;span&gt;3 mics · Yard Mic recording now&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;live-dot&quot; style=&quot;margin-right:6px&quot;&gt;&lt;/span&gt;${svg('chevR',16,2)}&lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;seclabel&quot;&gt;Library &amp; setup&lt;/div&gt;\n   &lt;div class=&quot;card hub&quot;&gt;\n     &lt;div class=&quot;hubitem&quot; onclick=&quot;go('recordings')&quot;&gt;&lt;span class=&quot;hg&quot;&gt;${svg('audio',20,1.9)}&lt;/span&gt;&lt;span class=&quot;ht&quot;&gt;&lt;b&gt;Recordings&lt;/b&gt;&lt;span&gt;Saved clips &amp; storage · 1.2 GB of 4 GB&lt;/span&gt;&lt;/span&gt;${svg('chevR',16,2)}&lt;/div&gt;\n     &lt;div class=&quot;hubitem&quot; onclick=&quot;go('settings')&quot;&gt;&lt;span class=&quot;hg&quot;&gt;${svg('sliders',20,1.9)}&lt;/span&gt;&lt;span class=&quot;ht&quot;&gt;&lt;b&gt;Settings&lt;/b&gt;&lt;span&gt;Detection accuracy, non-bird filter, account&lt;/span&gt;&lt;/span&gt;${svg('chevR',16,2)}&lt;/div&gt;\n   &lt;/div&gt;\n   &lt;div class=&quot;note&quot;&gt;On web these all live in the top nav; on mobile, Recordings &amp; Settings tuck under &lt;b&gt;More&lt;/b&gt; while Locations &amp; Devices stay reachable here and from the toolbar pickers' “Manage”.&lt;/div&gt;&lt;/div&gt;`;\n}\nfunction Locations(){\n return `&lt;div class=&quot;pagewrap&quot;&gt;&lt;div class=&quot;backrow&quot; onclick=&quot;go('more')&quot;&gt;&lt;span&gt;${svg('chevL',16,2.2)}&lt;/span&gt; More&lt;/div&gt;\n   &lt;div style=&quot;display:flex;align-items:center;gap:8px;padding:0 2px 8px&quot;&gt;&lt;span class=&quot;muted&quot; style=&quot;flex:1;font-size:11.5px&quot;&gt;Tap to view on Home. Pencil to edit; star = home.&lt;/span&gt;&lt;button class=&quot;btn sm&quot;&gt;${svg('plus',14,2.2)} Add&lt;/button&gt;&lt;/div&gt;\n   ${Object.values(PLACES).map(p=&gt;{const ed=editId==='loc:'+p.id;return `&lt;div class=&quot;card lcard&quot; style=&quot;${ed?'border-color:color-mix(in srgb,var(--accent) 33%,transparent)':''}&quot;&gt;\n     &lt;div class=&quot;lc-top&quot;&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;${svg('pin',18,1.9)}&lt;/span&gt;\n       &lt;b onclick=&quot;pickLoc('${p.id}')&quot; style=&quot;cursor:pointer&quot;&gt;${p.name} ${p.live?'&lt;span class=&quot;live-dot&quot;&gt;&lt;/span&gt;':''}&lt;/b&gt;\n       &lt;button class=&quot;star&quot; onclick=&quot;toggleHome('${p.id}')&quot;&gt;&lt;span style=&quot;color:${p.home?'var(--warn-solid)':'var(--faint)'}&quot;&gt;${svg('star',18,p.home?0:1.8)}&lt;/span&gt;&lt;/button&gt;\n       &lt;button class=&quot;miniact&quot; onclick=&quot;toggleEdit('loc:${p.id}')&quot;&gt;${svg(ed?'x':'pencil',14,2)}&lt;/button&gt;&lt;/div&gt;\n     ${ed?`&lt;div class=&quot;editbox&quot;&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Display name&lt;/span&gt;&lt;input class=&quot;inp&quot; value=&quot;${p.name}&quot;/&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Address or GPS&lt;/span&gt;&lt;input class=&quot;inp&quot; value=&quot;${p.addr}&quot;/&gt;&lt;/div&gt;&lt;p class=&quot;muted&quot; style=&quot;font-size:11px;margin:0&quot;&gt;Adaptive devices within ~40 m merge in automatically.&lt;/p&gt;&lt;div style=&quot;display:flex;gap:7px&quot;&gt;&lt;button class=&quot;btn sm danger&quot;&gt;${svg('trash',13,2)} Remove&lt;/button&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn sm primary&quot; onclick=&quot;toggleEdit('loc:${p.id}')&quot;&gt;${svg('check',13,2.2)} Save&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`\n       :`&lt;div class=&quot;sub&quot;&gt;${p.home?'&lt;span class=&quot;pill warn&quot;&gt;home&lt;/span&gt;':''}${p.confirmed} confirmed · ${p.detections.toLocaleString()} detections&lt;/div&gt;&lt;div class=&quot;meta&quot;&gt;${p.devices.map(devName).join(', ')}&lt;/div&gt;`}\n   &lt;/div&gt;`}).join('')}\n   &lt;div class=&quot;note&quot;&gt;Minimal edit-card, same as today — name, address, home, remove, merge. No per-location dashboard; viewing happens via the Home filter.&lt;/div&gt;&lt;/div&gt;`;\n}\nfunction Devices(){\n return `&lt;div class=&quot;pagewrap&quot;&gt;&lt;div class=&quot;backrow&quot; onclick=&quot;go('more')&quot;&gt;&lt;span&gt;${svg('chevL',16,2.2)}&lt;/span&gt; More&lt;/div&gt;\n   &lt;p class=&quot;muted&quot; style=&quot;font-size:11.5px;padding:0 2px 8px&quot;&gt;Tap to scope Home to a device. The always-on mic is your home device.&lt;/p&gt;\n   ${['yardmic','iphone','pixel'].map(id=&gt;{const d=DEVICES[id];const ed=editId==='dev:'+id;return `&lt;div class=&quot;card lcard&quot; style=&quot;${ed?'border-color:color-mix(in srgb,var(--accent) 33%,transparent)':''}&quot;&gt;\n     &lt;div class=&quot;lc-top&quot;&gt;&lt;span class=&quot;dev-glyph&quot; style=&quot;background:${d.alwaysOn?'var(--running-soft)':'var(--bg-inset)'};color:${d.alwaysOn?'var(--running)':'var(--muted)'}&quot;&gt;${svg(d.alwaysOn?'radio':'phone',19,1.9)}&lt;/span&gt;\n       &lt;b onclick=&quot;pickDev('${id}')&quot; style=&quot;cursor:pointer&quot;&gt;${d.name} ${d.alwaysOn?'&lt;span class=&quot;pill run&quot;&gt;always-on&lt;/span&gt;':''}${d.rec&amp;&amp;!d.alwaysOn?'&lt;span class=&quot;pill run&quot;&gt;recording&lt;/span&gt;':''}&lt;/b&gt;\n       &lt;button class=&quot;miniact&quot; onclick=&quot;toggleEdit('dev:${id}')&quot;&gt;${svg(ed?'x':'pencil',14,2)}&lt;/button&gt;&lt;/div&gt;\n     ${ed?`&lt;div class=&quot;editbox&quot;&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Device name&lt;/span&gt;&lt;input class=&quot;inp&quot; value=&quot;${d.name}&quot;/&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Mode&lt;/span&gt;&lt;span class=&quot;seg full&quot;&gt;&lt;button class=&quot;${d.mode==='Fixed'?'on':''}&quot;&gt;Fixed&lt;/button&gt;&lt;button class=&quot;${d.mode==='Adaptive'?'on':''}&quot;&gt;Adaptive (GPS)&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div&gt;&lt;span class=&quot;lbl&quot;&gt;Sharing&lt;/span&gt;&lt;span class=&quot;seg full&quot;&gt;&lt;button class=&quot;on&quot;&gt;Private&lt;/button&gt;&lt;button&gt;Shared&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;&lt;div style=&quot;display:flex;gap:7px&quot;&gt;&lt;button class=&quot;btn sm danger&quot;&gt;${svg('trash',13,2)} Remove&lt;/button&gt;&lt;span style=&quot;flex:1&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn sm primary&quot; onclick=&quot;toggleEdit('dev:${id}')&quot;&gt;${svg('check',13,2.2)} Save&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`\n       :`&lt;div class=&quot;sub&quot;&gt;${d.mode} · ${d.det.toLocaleString()} detections&lt;/div&gt;&lt;div class=&quot;meta&quot;&gt;${d.plat} · ${d.meta}&lt;/div&gt;`}\n   &lt;/div&gt;`}).join('')}\n   &lt;div class=&quot;note&quot;&gt;&lt;b&gt;Yard Mic is flagged “always-on”&lt;/b&gt; — your home device and the default scope. On-demand phones look the same but never default. Same minimal edit-card as today.&lt;/div&gt;&lt;/div&gt;`;\n}\n\n/* ===================================================================== sheets */\nfunction sheetEl(){return document.getElementById('sheet')}\nfunction showSheet(){document.getElementById('scrim').classList.add('show');sheetEl().classList.add('show')}\nfunction closeSheet(){document.getElementById('scrim').classList.remove('show');sheetEl().classList.remove('show')}\nfunction openLoc(){const p=PLACES;sheetEl().innerHTML=`&lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;&lt;h3&gt;Location&lt;/h3&gt;\n  ${Object.values(p).map(x=&gt;`&lt;div class=&quot;popt ${x.id===cur?'sel':''}&quot; onclick=&quot;pickLoc('${x.id}')&quot;&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;${svg('pin',18,1.9)}&lt;/span&gt;&lt;b&gt;${x.name} ${x.home?'&lt;span style=&quot;color:var(--warn-solid)&quot;&gt;'+svg('star',13,0)+'&lt;/span&gt;':''} ${x.live?'&lt;span class=&quot;live-dot&quot;&gt;&lt;/span&gt;':''}&lt;/b&gt;&lt;span class=&quot;pm&quot;&gt;${x.confirmed} birds&lt;/span&gt;&lt;/div&gt;`).join('')}\n  &lt;div class=&quot;popt ${cur==='all'?'sel':''}&quot; onclick=&quot;pickLoc('all')&quot;&gt;&lt;span class=&quot;muted&quot;&gt;${svg('globe',18,1.9)}&lt;/span&gt;&lt;b&gt;All locations&lt;/b&gt;&lt;span class=&quot;pm&quot;&gt;aggregate&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;sheetfoot&quot;&gt;&lt;button class=&quot;btn&quot; onclick=&quot;go('locations');closeSheet()&quot;&gt;${svg('sliders',14,1.9)} Manage&lt;/button&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;closeSheet()&quot;&gt;Done&lt;/button&gt;&lt;/div&gt;`;showSheet()}\nfunction openDev(){const p=PLACES[cur];sheetEl().innerHTML=`&lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;&lt;h3&gt;Device · ${p.name}&lt;/h3&gt;\n  ${p.devices.map(id=&gt;{const d=DEVICES[id];return `&lt;div class=&quot;popt ${id===curDev?'sel':''}&quot; onclick=&quot;pickDev('${id}')&quot;&gt;&lt;span style=&quot;color:${d.alwaysOn?'var(--running)':'var(--accent)'}&quot;&gt;${svg(d.alwaysOn?'radio':'phone',18,1.9)}&lt;/span&gt;&lt;b&gt;${d.name} ${d.alwaysOn?'&lt;span class=&quot;pill run&quot;&gt;always-on&lt;/span&gt;':''}&lt;/b&gt;&lt;span class=&quot;pm&quot;&gt;${d.mode} · ${d.det.toLocaleString()}&lt;/span&gt;&lt;/div&gt;`}).join('')}\n  &lt;div class=&quot;popt ${curDev==='all'?'sel':''}&quot; onclick=&quot;pickDev('all')&quot;&gt;&lt;span class=&quot;muted&quot;&gt;${svg('list',18,1.9)}&lt;/span&gt;&lt;b&gt;All devices&lt;/b&gt;&lt;span class=&quot;pm&quot;&gt;${p.devices.length} mics&lt;/span&gt;&lt;/div&gt;\n  &lt;div class=&quot;sheetfoot&quot;&gt;&lt;button class=&quot;btn&quot; onclick=&quot;go('devices');closeSheet()&quot;&gt;${svg('sliders',14,1.9)} Manage&lt;/button&gt;&lt;button class=&quot;btn primary&quot; onclick=&quot;closeSheet()&quot;&gt;Done&lt;/button&gt;&lt;/div&gt;`;showSheet()}\nfunction openTime(){sheetEl().innerHTML=`&lt;div class=&quot;grab&quot;&gt;&lt;/div&gt;&lt;h3&gt;Time range&lt;/h3&gt;\n  ${[['Today','Today'],['7d','Last 7 days'],['30d','Last 30 days'],['all','All time']].map(([k,l])=&gt;`&lt;div class=&quot;popt ${timeScope===k?'sel':''}&quot; onclick=&quot;pickTime('${k}')&quot;&gt;&lt;span style=&quot;color:var(--accent)&quot;&gt;${svg('calendar',18,1.9)}&lt;/span&gt;&lt;b&gt;${l}&lt;/b&gt;&lt;/div&gt;`).join('')}\n  &lt;div class=&quot;pop
