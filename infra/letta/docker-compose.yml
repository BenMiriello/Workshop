services:
  letta-db:
    image: pgvector/pgvector:pg16
    container_name: letta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
      POSTGRES_DB: letta
    volumes:
      - /mnt/secure_storage/clawd/letta-db:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 5s
      timeout: 5s
      retries: 5

  letta:
    image: letta/letta:latest
    container_name: letta
    restart: unless-stopped
    depends_on:
      letta-db:
        condition: service_healthy
    environment:
      LETTA_PG_URI: postgresql://letta:letta@letta-db:5432/letta
      LETTA_SERVER_PASS: workshop-local
      # Ollama runs on the host (network_mode: host); reach it via the docker bridge gateway.
      # Append /v1 so Letta's OpenAI-compat client targets Ollama's /v1/embeddings (not /embeddings).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8283:8283"
    volumes:
      - /mnt/secure_storage/clawd/letta-config:/root/.letta
