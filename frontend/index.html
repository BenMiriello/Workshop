<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero
         in the iOS WebView; without it the app's safe-area handling (chat
         composer, sticky bars, dock) collapses to 0 under the notch / home
         indicator. interactive-widget=resizes-content keeps the layout above
         the software keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <!-- Dark by default: paint the dark page bg immediately (before fonts/CSS
         load) so first paint is never a white flash. The bootstrap script below
         may switch to light/system per the persisted choice. -->
    <style>
      html { background: #100d11; }
    </style>
    <!-- iOS Safari requires an explicit Permissions-Policy grant before it will
         honor navigator.geolocation.getCurrentPosition / watchPosition, even on
         HTTPS. Without this, WebKit returns PositionError code 1 with message
         "Origin does not have permission to use Geolocation service." The HTTP
         response-header equivalent is also set by Vite middleware (vite.config.ts);
         this meta tag is the fallback for environments where the header is stripped. -->
    <meta http-equiv="Permissions-Policy" content="geolocation=(self)" />
    <title>Workshop</title>
    <!-- Workshop Design System fonts: Hanken Grotesk (UI) + JetBrains Mono (ids/endpoints/numbers). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Pre-React appearance bootstrap. Applies both axes to <html> before any
         paint so there's no light/dark or wrong-scheme flash.
           localStorage["ws-theme"]   = "light" | "dark" | "system"  (default dark)
           localStorage["ws-palette"] = one of the eight ids in palettes.gen.ts
                                        (default iris)
         Settings is the only writer of either; see packages/ui/src/theme.ts. The
         scheme list is duplicated here because this runs before any module
         loads — keep it in step with PALETTE_IDS and LEGACY_PALETTES if a
         scheme is ever added or renamed. -->
    <script>
      (function () {
        var PALETTES = ["lagoon", "iris", "cobalt", "fern", "clay", "slate", "linen", "graphite"];
        // Ids from before the agency color model, mapped to their nearest
        // surviving scheme so a saved preference moves across instead of
        // silently snapping to the default. (cobalt kept its id and its hue.)
        var LEGACY = { violet: "iris", plum: "iris", teal: "lagoon", sandstone: "linen" };
        var root = document.documentElement;
        try {
          root.setAttribute("data-theme", localStorage.getItem("ws-theme") || "dark");
          var p = localStorage.getItem("ws-palette");
          if (PALETTES.indexOf(p) < 0) p = LEGACY[p] || "iris";
          root.setAttribute("data-palette", p);
        } catch (e) {
          root.setAttribute("data-theme", "dark");
          root.setAttribute("data-palette", "iris");
        }
      })();
    </script>
    <!-- BLOCKING service-worker killer. Runs before any module loads so a
         stale cached SW from an earlier deploy can't intercept fetches.
         Triggers a single reload after cleanup so the page is served from
         the network. No-op once the origin is clean. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var hadSW = regs.length > 0;
              Promise.all(regs.map(function (r) { return r.unregister(); }))
                .then(function () {
                  if (window.caches && caches.keys) {
                    return caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    });
                  }
                })
                .then(function () {
                  if (hadSW && !sessionStorage.getItem('__sw_killed__')) {
                    sessionStorage.setItem('__sw_killed__', '1');
                    location.reload();
                  }
                });
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
