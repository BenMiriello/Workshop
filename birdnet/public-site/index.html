<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yard Birds</title>
  <meta name="description" content="Birds detected at a backyard listening station." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <h1>Yard Birds</h1>
    <p class="sub" id="subtitle">Backyard bird-song station</p>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="panel">
      <h2>Activity by hour</h2>
      <div class="bars" id="hourly"></div>
    </section>

    <section class="panel">
      <h2>Species seen <span class="muted" id="species-count"></span></h2>
      <table id="species">
        <thead>
          <tr><th>Bird</th><th>Detections</th><th>First seen</th><th>Last seen</th><th>Best</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <p class="foot muted" id="foot"></p>
  </main>

  <!-- This page reads ONE file: the sanitized dataset. It has no API, no audio,
       no map, no location, and no path to anything private. That data was never
       sent here. -->
  <script src="./app.js"></script>
</body>
</html>
