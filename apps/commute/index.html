<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- iOS Safari requires an explicit Permissions-Policy grant before it will
         honor navigator.geolocation. Same fix as the workshop frontend.
         Vite middleware in vite.config.ts also sends this as an HTTP header. -->
    <meta http-equiv="Permissions-Policy" content="geolocation=(self)" />
    <title>Commute</title>
    <!-- BLOCKING service-worker killer. MUST run before any module loads so a
         stale cached SW from a prior build cannot intercept fetches for this
         page. Triggers a one-time reload after cleanup so the fresh page is
         served from network. -->
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var hadSW = regs.length > 0;
              Promise.all(regs.map(function (r) { return r.unregister(); }))
                .then(function () {
                  if (window.caches && caches.keys) {
                    return caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                    });
                  }
                })
                .then(function () {
                  if (hadSW && !sessionStorage.getItem('__sw_killed__')) {
                    sessionStorage.setItem('__sw_killed__', '1');
                    location.reload();
                  }
                });
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
